<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融监管报告比较 · 结果展示</title>
  <link rel="stylesheet" href="themes.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* 顶栏 */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: linear-gradient(120deg, #0b1f3a 0%, #1e3a8a 55%, #2563eb 100%);
      color: #fff;
      padding: 18px 24px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .18);
    }
    .topbar-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .topbar-title { font-size: 21px; font-weight: 700; letter-spacing: .3px; }
    .topbar-title .accent { color: #7dd3fc; }
    .topbar-sub { font-size: 13px; color: rgba(255,255,255,.72); margin-top: 4px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .env-badge {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: #fde68a;
      border-radius: 999px; padding: 5px 14px; font-size: 12px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .env-badge::before { content: '●'; font-size: 8px; color: #4ade80; }

    .page { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }

    /* 统计卡片 */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 3px 10px rgba(15,23,42,.05);
    }
    .card-label { color: var(--muted); font-size: 12px; }
    .card-value { font-size: 22px; font-weight: 600; margin-top: 4px; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
    .card-value.ok { color: var(--pass); }
    .card-value.bad { color: var(--fail); }
    .card-value.warn { color: var(--warn); }

    /* 工具栏 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .toolbar input[type="search"] {
      flex: 1 1 240px;
      min-width: 180px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }
    .toolbar input[type="search"]:focus { border-color: var(--accent); }
    .toolbar select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .toolbar select:disabled { opacity: .45; cursor: not-allowed; }

    /* 主体布局 */
    .layout {
      display: grid;
      grid-template-columns: var(--side-w, 280px) 1fr;
      gap: 16px;
      align-items: stretch;
    }
    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* 最近批次：浮动 docker 式 dock + 呼出面板（不占主布局空间） */
    .batch-dock {
      position: fixed; top: 50%; transform: translateY(-50%);
      left: 12px; right: auto; z-index: 45;
      width: 48px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.16);
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 0; gap: 6px;
    }
    body.batch-side-right .batch-dock { left: auto; right: 12px; }
    .bd-btn {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .bd-btn:hover { color: var(--accent); border-color: var(--accent); }
    .bd-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
    .bd-recent { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; align-items: center; }
    .bd-chip {
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--muted); font-family: var(--mono); font-size: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      position: relative;
    }
    .bd-chip:hover { border-color: var(--accent); color: var(--accent); }
    .bd-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .bd-chip.incompat::after {
      content: ''; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--warn); border: 2px solid var(--card);
    }
    .bd-sep { width: 22px; height: 1px; background: var(--border); }
    .bd-empty { writing-mode: vertical-rl; font-size: 10px; color: var(--muted); letter-spacing: 1px; text-align: center; }
    .batch-panel {
      position: fixed; top: 50%; translate: 0 -50%;
      left: 70px; right: auto; z-index: 45;
      width: var(--batch-w, 320px); max-height: calc(100vh - 32px);
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0,0,0,.22);
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    body.batch-side-right .batch-panel { left: auto; right: 70px; }
    .batch-panel:not([hidden]) { animation: batchIn .18s ease; }
    @keyframes batchIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    body.batch-side-right .batch-panel:not([hidden]) { animation-name: batchInRight; }
    @keyframes batchInRight { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    .bp-head {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; font-weight: 600;
      cursor: default; user-select: none; -webkit-user-select: none;
    }
    .bp-head .bp-count { background: var(--indigo-bg); color: var(--indigo-fg); border-radius: 999px; padding: 2px 10px; font-size: 12px; margin-left: auto; cursor: help; }
    .bp-collapse { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; }
    .bp-collapse:hover { color: var(--accent); }
    .bp-controls { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .bp-search { display: flex; align-items: center; gap: 6px; }
    .bp-search-toggle { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; }
    .bp-search-toggle:hover { color: var(--accent); }
    .bp-toggle-row { display: flex; align-items: center; gap: 8px; }
    .bp-toggle-row .bp-search-toggle { align-self: center; }
    .bp-toggle-spacer { flex: 1 1 auto; }
    .bp-search input { flex: 1 1 auto; min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--surface); color: var(--text); }
    .bp-search input:focus { border-color: var(--accent); outline: none; }
    .bp-clear { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 4px; }
    .bp-clear:hover { color: var(--accent); }
    .bp-row { display: flex; align-items: center; gap: 6px; }
    .bp-row input[type="text"] { flex: 1 1 auto; min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--surface); color: var(--text); }
    .bp-row input[type="text"]:focus { border-color: var(--accent); outline: none; }
    .bp-row select { flex: 1 1 auto; min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--surface); color: var(--text); }
    .bp-cal { border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; border-radius: 8px; padding: 6px 8px; font-size: 13px; }
    .bp-cal:hover { color: var(--accent); border-color: var(--accent); }
    .bp-date-hint { color: var(--muted); font-size: 11px; }
    .bp-notice { margin: 10px 12px 0; padding: 8px 10px; border-radius: 8px; font-size: 12px; background: var(--fail-bg); color: var(--fail); }
    .bp-list { flex: 1 1 auto; overflow: auto; min-height: 0; max-height: var(--bp-list-h, 480px); }
    .bp-pager { padding: 8px 12px; border-top: 1px solid var(--border); display: flex; justify-content: center; align-items: center; gap: 4px; }
    .bp-pager:empty { display: none; }
    .bp-resize { height: 10px; flex: 0 0 auto; cursor: ns-resize; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 10px; letter-spacing: 3px; user-select: none; -webkit-user-select: none; }
    .bp-resize:hover { color: var(--accent); background: var(--hover); }
    .bp-resize.top { border-top: none; border-bottom: 1px solid var(--border); }
    body.bp-resizing { cursor: ns-resize; user-select: none; -webkit-user-select: none; }
    .batch-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); user-select: none; -webkit-user-select: none; }
    .batch-item:focus { outline: none; }
    .batch-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .batch-item:last-child { border-bottom: none; }
    .batch-item:hover { background: var(--surface-2); }
    .batch-item.active { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
    .batch-item.incompat { opacity: .78; }
    .bi-top { display: flex; align-items: center; gap: 6px; }
    .bi-name { font-weight: 600; font-family: var(--mono); font-size: 12px; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bi-info { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px; }
    .bi-info:hover { color: var(--accent); }
    .bi-time { color: var(--muted); font-size: 11px; margin-top: 2px; font-family: var(--mono); }
    .bi-desc { color: var(--muted); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bi-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .b-badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
    .b-badge.bv { background: var(--chip-code-bg); color: var(--chip-code-fg); }
    .b-badge.benv { background: var(--indigo-bg); color: var(--indigo-fg); }
    .b-badge.ok { background: var(--pass-bg); color: var(--pass); }
    .b-badge.bad { background: var(--warn-bg); color: var(--warn); }
    .b-badge.bsum { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
    .batch-item .empty { padding: 18px 14px; color: var(--muted); font-size: 12px; }
    .bp-compat { border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; border-radius: 999px; padding: 2px 9px; font-size: 12px; line-height: 1.6; }
    .bp-compat:hover { color: var(--accent); border-color: var(--accent); }
    .bp-compat.on { color: var(--pass); border-color: var(--pass); background: var(--pass-bg); }
    .bd-card {
      position: fixed; z-index: 60; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.2);
      pointer-events: none; font-size: 12px; max-width: 260px; animation: popIn .12s ease;
    }
    .bd-card .bdc-name { font-weight: 600; font-family: var(--mono); word-break: break-all; }
    .bd-card .bdc-time { color: var(--muted); font-size: 11px; margin-top: 3px; font-family: var(--mono); }
    .bd-card .bdc-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .batch-qd {
      position: fixed; z-index: 55; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; box-shadow: 0 12px 36px rgba(0,0,0,.22);
      pointer-events: auto; font-size: 12px; max-width: 300px; animation: popIn .12s ease;
    }
    .batch-qd .bq-name { font-weight: 600; font-family: var(--mono); font-size: 13px; word-break: break-all; }
    .batch-qd .bq-time { color: var(--muted); font-size: 11px; margin-top: 3px; font-family: var(--mono); }
    .batch-qd .bq-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .batch-help { max-width: 760px; }
    .batch-help .modal-body { padding: 16px 20px; }
    .batch-help .hd-block { margin-bottom: 16px; }
    .batch-help .hd-block h4 { margin: 0 0 8px; font-size: 14px; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 8px; }
    .batch-help .hd-block p { font-size: 13px; color: var(--text); margin: 6px 0; line-height: 1.7; }
    .batch-help .hd-block ul { margin: 6px 0; padding-left: 20px; }
    .batch-help .hd-block li { font-size: 13px; margin: 4px 0; line-height: 1.6; }
    .batch-help .hd-block pre { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow: auto; color: var(--print-fg); white-space: pre-wrap; }
    .bp-sk { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .bp-sk-line { display: block; height: 10px; border-radius: 6px; background: var(--hover); margin: 5px 0; animation: skPulse 1.1s ease-in-out infinite; }
    .bp-sk-line.w55 { width: 55%; }
    .bp-sk-line.w35 { width: 35%; }
    .bp-sk-line.w75 { width: 75%; }
    @keyframes skPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

    /* 顶栏批次徽章 */
    .batch-badge {
      border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12);
      color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
      max-width: 220px; display: inline-flex; align-items: center; gap: 6px;
    }
    .batch-badge .batch-badge-text {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .batch-badge:hover { background: rgba(255,255,255,.22); }

    /* 强制加载不兼容批次横幅 */
    .batch-force-banner {
      display: flex; align-items: center; gap: 10px;
      margin: 12px 18px 0; padding: 10px 14px; border-radius: 8px;
      background: var(--warn-bg); color: var(--warn); font-size: 13px;
    }
    .batch-force-banner button {
      margin-left: auto; border: 1px solid var(--warn); background: none; color: var(--warn);
      border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .batch-force-banner button:hover { background: var(--warn); color: var(--bg); }

    /* 批次浮层显隐（hidden 属性需显式覆盖 display） */
    .batch-dock[hidden], .batch-panel[hidden], .batch-badge[hidden], .batch-force-banner[hidden] { display: none; }
    .bd-grip { width: 30px; height: 14px; cursor: grab; color: var(--muted); font-size: 9px; letter-spacing: 1px; line-height: 1; text-align: center; user-select: none; }
    .bd-grip:hover { color: var(--accent); }
    body.dock-dragging { cursor: grabbing; user-select: none; }
    .spin { display: inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .batch-ring::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      border: 2px solid var(--accent); pointer-events: none;
      animation: batchRingPulse 1.6s ease-out forwards;
    }
    @keyframes batchRingPulse {
      0% { opacity: 1; box-shadow: 0 0 0 2px var(--accent), 0 0 14px 2px var(--accent); }
      45% { opacity: 1; box-shadow: 0 0 0 2px var(--accent), 0 0 14px 2px var(--accent); }
      100% { opacity: 0; box-shadow: 0 0 0 10px transparent, 0 0 0 0 transparent; }
    }

    /* 批次信息弹窗 */
    .bi-kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin-bottom: 14px; font-size: 13px; }
    .bi-kv .k { color: var(--muted); }
    .bi-kv .v { min-width: 0; word-break: break-all; font-family: var(--mono); font-size: 12px; }
    .bi-dir { display: flex; align-items: center; gap: 6px; }
    .bi-dir .bi-link { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .bi-dir .bi-link:hover { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px; }
    .bi-copy { border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; border-radius: 6px; padding: 2px 7px; font-size: 12px; line-height: 1.4; flex: 0 0 auto; }
    .bi-copy:hover { color: var(--accent); border-color: var(--accent); }
    .bi-copy.copied { color: var(--pass); border-color: var(--pass); }
    .bi-cmd-label { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
    .bi-cmd { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; color: var(--print-fg); max-height: 220px; overflow: auto; }
    @media (max-width: 920px) {
      .batch-dock { top: auto; bottom: 16px; transform: none; }
      .batch-panel { top: 16px; bottom: 16px; translate: 0 0; max-height: none; width: auto; left: 16px; right: 16px; border-radius: 14px; }
      body.batch-side-right .batch-panel { left: 16px; right: 16px; }
      .batch-panel:not([hidden]) { animation-name: batchIn; }
      body.batch-side-right .batch-panel:not([hidden]) { animation-name: batchIn; }
    }

    /* 侧栏 item 列表 */
    .sidebar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }
    .sidebar-head {
      padding: 12px 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-head .count {
      background: var(--indigo-bg);
      color: var(--indigo-fg);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
    }
    .item { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .item:hover { background: var(--surface-2); }
    .item.active { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
    .item-id { font-weight: 600; font-family: var(--mono); }
    .item-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bar { height: 6px; background: var(--bar-bg); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--pass); border-radius: 999px; }

    /* 详情区 */
    .detail {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .detail-head { padding: 16px 18px 0; }
    .detail-head h2 { margin: 0; font-size: 18px; font-family: var(--mono); }
    .detail-head .channels { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .tab {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab:hover { border-color: var(--accent); color: var(--accent); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab-count {
      background: var(--hover);
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
    }
    .tab.active .tab-count { background: rgba(255,255,255,.25); }

    .channel-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 18px 0;
    }
    .ctab {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ctab:hover { border-color: var(--accent); color: var(--accent); }
    .ctab.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .ctab-count { color: var(--muted); font-size: 12px; }
    .ctab.active .ctab-count { color: var(--accent); }

    .content { padding: 16px 18px 20px; }

    /* 表格 */
    .table-wrap { overflow: auto; max-height: 72vh; }
    .table-wrap thead th { position: sticky; top: 0; z-index: 2; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    tr.row-fail td { background: var(--row-fail-bg); }
    .table-wrap tbody tr:hover td { background: var(--hover); }
    .health-table tbody tr:hover td { background: var(--hover); }
    table th.col-hover, table td.col-hover { background: var(--accent-bg) !important; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .xpath { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 34px !important; }
    .empty::before { content: '○'; display: block; font-size: 26px; line-height: 1; color: var(--border); margin-bottom: 8px; }

    /* 徽章与芯片 */
    .chip { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
    .channel-chip { background: var(--indigo-bg); color: var(--indigo-fg); }
    .tp-platform { background: var(--chip-platform-bg); color: var(--chip-platform-fg); }
    .tp-product { background: var(--chip-product-bg); color: var(--chip-product-fg); }
    .tp-context { background: var(--chip-context-bg); color: var(--chip-context-fg); }
    .badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
    .badge.pass { background: var(--pass-bg); color: var(--pass); }
    .badge.fail { background: var(--fail-bg); color: var(--fail); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .num-pass { color: var(--pass); font-weight: 600; }
    .num-fail { color: var(--fail); font-weight: 600; }

    /* 分页 */
    .pagination { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .pg {
      min-width: 30px; height: 30px;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .pg:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pg.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pg:disabled { opacity: .4; cursor: not-allowed; }
    .pg-info { color: var(--muted); font-size: 12px; margin: 0 6px; }
    .pagination select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--surface); color: var(--text); }

    /* 日志 */
    .log-box {
      background: var(--surface-2); color: var(--print-fg);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px;
      font-family: var(--mono); font-size: 12px;
      max-height: 520px; overflow: auto;
    }
    .log-line { white-space: pre-wrap; word-break: break-all; }

    .meta-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .footer-note { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; }

    /* 过滤标识 chips */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filters:empty { display: none; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--indigo-bg); color: var(--indigo-fg);
      border-radius: 999px; padding: 4px 10px; font-size: 12px;
    }
    .filter-chip button {
      border: none; background: none; color: var(--indigo-fg);
      cursor: pointer; font-size: 13px; line-height: 1; padding: 0;
    }
    .filter-chip button:hover { color: var(--accent); }

    /* 可点击统计卡片 */
    .card.clickable { cursor: pointer; transition: box-shadow .15s, border-color .15s, transform .12s; }
    .card.clickable:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.12); transform: translateY(-1px); }
    .card.active-filter { border-color: var(--accent); background: var(--accent-bg); }

    /* 元信息行 */
    .meta-line { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* 文件面板 */
    .files { margin-top: 14px; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
    .files-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
    .files-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
    .file-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
    .file-card .fc-head { font-weight: 600; font-size: 12px; color: var(--indigo-fg); padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
    .file-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
    .ftag { flex: 0 0 auto; min-width: 26px; text-align: center; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); }
    .ftag-eo { background: var(--pass-bg); color: var(--pass); }
    .ftag-ao { background: var(--accent-bg); color: var(--accent); }
    .ftag-xl { background: var(--chip-product-bg); color: var(--chip-product-fg); }
    .file-row .file-link, .file-row .file-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .file-meta { flex: 0 0 auto; color: var(--muted); font-size: 11px; font-family: var(--mono); }
    .file-link { color: var(--accent); text-decoration: none; cursor: pointer; }
    .file-link:hover { text-decoration: underline; }

    /* 表头排序 + 过滤输入 */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th .sort-arrow { font-size: 10px; margin-left: 2px; color: var(--accent); }
    th .hfilter {
      margin-top: 4px; width: 100%; padding: 4px 6px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; font-weight: 400; color: var(--text);
      background: var(--surface);
    }
    th .hfilter:focus { border-color: var(--accent); outline: none; }
    th select.hfilter { padding: 4px 2px; }

    /* 值预览 */
    .val {
      max-width: 200px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-family: var(--mono); font-size: 12px;
      display: inline-block; vertical-align: middle;
    }
    .val-link { color: var(--accent); cursor: pointer; text-decoration: none; }
    .val-link:hover { text-decoration: underline; }

    /* 详情弹窗 */
    .modal-backdrop {
      position: fixed; inset: 0; background: var(--modal-backdrop);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 20px;
    }
    .modal {
      background: var(--surface); border-radius: 12px; max-width: 880px; width: 100%;
      max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { margin: 0; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close { border: none; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px 18px; overflow: auto; }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; margin-bottom: 14px; font-size: 13px; }
    .kv .k { color: var(--muted); }
    .kv .v { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .ri-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .ri-value { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; color: var(--print-fg); max-height: 280px; overflow: auto; }
    .result-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .result-extra { margin-top: 12px; }
    .print-box { margin-top: 14px; }
    .print-box .pb-head { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    @media (max-width: 640px) { .result-pair { grid-template-columns: 1fr; } }

    /* 命中Ctx 标签（详情页，可点击查看定义/命中情况） */
    .ctx-tag {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--surface-2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px;
      font-size: 12px; font-family: var(--mono); cursor: pointer; user-select: none;
      margin: 1px 4px 1px 0; white-space: normal; word-break: break-all; max-width: 260px;
    }
    .ctx-tag:hover { color: var(--accent); border-color: var(--accent); }
    .ctx-def-popup {
      position: fixed; z-index: 60; max-width: 380px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; box-shadow: 0 12px 32px rgba(0,0,0,.25); font-size: 12px;
    }
    .ctx-def-key { font-family: var(--mono); font-weight: 600; color: var(--accent); margin-bottom: 6px; word-break: break-all; }
    .ctx-def-row { margin-top: 5px; color: var(--text); line-height: 1.5; }
    .ctx-def-label { color: var(--muted); margin-right: 6px; font-weight: 600; }

    /* 规则分组（conversion / validation）—— 细左侧线条，不用完整边框 */
    .rule-group {
      margin-top: 14px;
      border-left: 3px solid var(--border);
      padding-left: 12px;
    }
    .rule-group-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .rule-tag { display: inline-block; background: var(--chip-product-bg); color: var(--chip-product-fg); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-family: var(--mono); }
    .rule-mono { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-all; color: var(--print-fg); }
    .rule-ctx { margin-top: 6px; display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap; }
    .rule-ctx-label { color: var(--muted); font-size: 12px; flex: 0 0 auto; padding-top: 3px; }

    /* Excel 配置按钮与面板 */
    .excel-btn {
      margin-left: 6px; border: 1px solid var(--border); background: var(--surface);
      color: var(--accent); border-radius: 6px; padding: 0 10px; cursor: pointer;
      font-size: 11px; font-weight: 500; line-height: 20px; white-space: nowrap; vertical-align: middle;
    }
    .excel-btn::before { content: "⚙"; margin-right: 4px; font-size: 11px; }
    .excel-btn:hover, .excel-btn.active { border-color: var(--accent); background: var(--accent-bg); }
    .excel-detail { margin-top: 8px; border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; overflow: hidden; }
    .excel-detail-head { background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 600; padding: 3px 10px; border-bottom: 1px solid var(--border); }
    .excel-detail pre {
      margin: 0; padding: 8px 10px; background: var(--surface);
      font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; color: var(--print-fg);
    }
    .copy-btn { margin-left: 6px; border: none; background: transparent; color: var(--num-muted); border-radius: 4px; padding: 0 4px; cursor: pointer; font-size: 12px; line-height: 18px; vertical-align: middle; }
    .copy-btn:hover { color: var(--accent); background: var(--accent-bg); }
    .copy-btn.copied { color: var(--pass); }

    /* item 元信息栏 */
    .item-bar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .item-bar h2 { margin: 0; font-size: 18px; font-family: var(--mono); }
    .item-bar .meta-line { margin-top: 0; }

    /* 可折叠报告信息 */
    .collapse-toggle {
      margin-top: 10px; border: 1px solid var(--border); background: var(--surface-2);
      border-radius: 8px; padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--muted);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .collapse-toggle:hover { color: var(--accent); border-color: var(--accent); }
    .collapse-toggle .chev { transition: transform .15s; }
    .collapse-toggle.open .chev { transform: rotate(180deg); }
    .report-cats { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; align-self: center; }
    .report-cat {
      width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
      cursor: pointer; padding: 0; font-size: 15px; line-height: 1;
    }
    .report-cat:hover { border-color: var(--accent); }
    .report-cat.active { border-color: var(--accent); background: var(--accent-bg); }
    .report-cat[data-cat="charts"] .rc-ico { color: var(--pass); }
    .report-cat[data-cat="files"] .rc-ico { color: var(--accent); }
    .report-cat[data-cat="note"] .rc-ico { color: var(--indigo-fg); }
    .report-info { margin-top: 10px; max-height: 380px; overflow-y: auto; padding-right: 4px; }

    /* 侧栏过滤 */
    .sidebar-filters { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
    .sidebar-filters input, .sidebar-filters select {
      flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 12px; color: var(--text); outline: none; background: var(--surface);
    }
    .sidebar-filters input:focus, .sidebar-filters select:focus { border-color: var(--accent); }
    .sidebar-list { position: absolute; left: 0; right: 0; overflow: auto; }
    .sidebar-pager { margin-top: auto; padding: 8px 12px; border-top: 1px solid var(--border); display: flex; justify-content: center; align-items: center; gap: 4px; }
    .sidebar-pager:empty { display: none; }
    .load-more { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    .load-more:hover { color: var(--accent); border-color: var(--accent); }

    /* 表头过滤图标按钮 */
    th .hf-toggle, th .mhf-toggle, th .special-toggle, th .bulk-toggle {
      margin-left: 4px; border: none; background: none; cursor: pointer;
      color: var(--muted); font-size: 12px; padding: 0 2px; vertical-align: middle;
    }
    th .hf-toggle:hover, th .hf-toggle.active, th .mhf-toggle:hover, th .mhf-toggle.active, th .special-toggle:hover, th .special-toggle.active, th .bulk-toggle:hover { color: var(--accent); }

    /* 浮层 popover */
    .popover {
      position: fixed; z-index: 48; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    .pop-control {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text); outline: none; box-sizing: border-box; background: var(--surface);
    }
    .pop-control:focus { border-color: var(--accent); }
    .col-option { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: 13px; cursor: pointer; border-radius: 6px; }
    .col-option:hover { background: var(--hover); }
    .popover-title { font-size: 12px; color: var(--muted); margin: 0 0 6px; }

    /* 字段工具栏 */
    .fields-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .col-toggle {
      border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
      padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--muted);
    }
    .col-toggle:hover, .col-toggle.active { color: var(--accent); border-color: var(--accent); }
    .fields-count { color: var(--muted); font-size: 12px; }

    /* item 属性芯片 */
    .attr-chip { background: var(--indigo-bg); color: var(--indigo-fg); border-radius: 6px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }

    /* 任务说明 */
    .task-note { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
    .task-note-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .task-note-text { font-size: 13px; white-space: pre-wrap; word-break: break-word; color: var(--text); }

    /* 侧栏多选按钮 */
    .sidebar-filters { flex-wrap: wrap; }
    .sidebar-filters input[type="search"] { flex: 1 1 100%; }
    .sidebar-filters select { flex: 1 1 auto; }
    .sidebar-filters .search-wrap { flex: 1 1 100%; position: relative; }
    .sidebar-filters .search-wrap input { width: 100%; }
    .sidebar-filters .search-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: none; background: none; color: var(--muted); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 2px; display: none;
    }
    .sidebar-filters .search-wrap.has-value .search-clear { display: block; }
    .side-multi {
      border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
      padding: 6px 8px; cursor: pointer; font-size: 12px; color: var(--muted); flex: 0 0 auto;
    }
    .side-multi:hover, .side-multi.active { color: var(--accent); border-color: var(--accent); }
    .side-multi.has-filter { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
    .channel-tabs .col-toggle { margin-left: auto; }

    /* 侧栏过滤 chips */
    .sidebar-chips { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; }
    .sidebar-chips:empty { display: none; }

    /* 值单元格展开 */
    .val-full { font-family: var(--mono); font-size: 12px; word-break: break-word; }
    .val-details { display: inline-block; max-width: 300px; vertical-align: middle; }
    .val-details summary {
      cursor: pointer; color: var(--accent); font-family: var(--mono); font-size: 12px;
      list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px;
    }
    .val-details summary::-webkit-details-marker { display: none; }
    .val-details summary::before { content: '▸ '; }
    .val-details[open] summary::before { content: '▾ '; }
    .val-details pre {
      margin: 4px 0 0; padding: 6px 8px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 6px;
      font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
      max-height: 220px; overflow: auto; max-width: 420px;
    }

    /* 高亮 */
    mark { background: var(--mark-bg); color: inherit; padding: 0 1px; border-radius: 2px; }

    /* 进度条警告色 */
    .bar-fill.bar-warn { background: var(--bar-warn); }

    /* 忽略行与按钮 */
    tr.row-ignored td { background: var(--row-ignored-bg) !important; color: var(--row-ignored-fg) !important; }
    tr.row-ignored td .chip, tr.row-ignored td .badge { opacity: .55; }
    .ignore-btn {
      border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
      padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap;
    }
    .ignore-btn:hover { color: var(--accent); border-color: var(--accent); }
    .ignore-btn.ignored { color: var(--ignore-on-fg); border-color: var(--ignore-on-border); background: var(--ignore-on-bg); }

    /* 文本长内容展开 */
    .text-full { font-size: 13px; word-break: break-word; }
    .text-details { display: inline-block; max-width: 480px; vertical-align: top; }
    .text-details summary {
      cursor: pointer; color: var(--accent); font-size: 13px; list-style: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px;
    }
    .text-details summary::-webkit-details-marker { display: none; }
    .text-details summary::before { content: '▸ '; }
    .text-details[open] summary::before { content: '▾ '; }
    .text-details pre {
      margin: 4px 0 0; padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; white-space: pre-wrap; word-break: break-word;
      max-height: 200px; overflow: auto; max-width: 560px; font-family: inherit;
    }

    /* 警告页签工具栏 */
    .warn-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .warn-toolbar:empty { display: none; }
    .export-btn {
      border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
      padding: 5px 12px; cursor: pointer; font-size: 12px; color: var(--muted);
    }
    .export-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* 警告统计第二数字置灰 */
    .num-muted { color: var(--num-muted); font-weight: 400; }

    /* 禁用渠道页签 */
    .ctab.disabled { opacity: .55; }

    /* 命中Ctx 标签 */
    .ctx-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .ctx-chip { background: var(--chip-ctx-bg); color: var(--chip-ctx-fg); white-space: normal; word-break: break-all; max-width: 220px; }

    /* 值类型芯片（字段比较·类型列） */
    .vt-id { background: var(--chip-platform-bg); color: var(--chip-platform-fg); }
    .vt-num { background: var(--chip-product-bg); color: var(--chip-product-fg); }
    .vt-date { background: var(--chip-context-bg); color: var(--chip-context-fg); }
    .vt-code { background: var(--chip-code-bg); color: var(--chip-code-fg); }
    .vt-product { background: var(--chip-ctx-bg); color: var(--chip-ctx-fg); }
    .vt-text { background: var(--hover); color: var(--muted); }
    .vt-multi { background: var(--row-fail-bg); color: var(--fail); }

    /* 错误类型芯片（错误页签·类型列） */
    .er-xpath { background: var(--chip-platform-bg); color: var(--chip-platform-fg); }

    .er-mapping { background: var(--chip-product-bg); color: var(--chip-product-fg); }

    /* 未启用渠道提示 */

    .channel-disabled .cd-desc { margin-top: 10px; font-size: 13px; color: var(--muted); }

    /* 批量忽略确认对话框 */
    .bulk-desc { font-size: 13px; color: var(--text); margin: 0 0 16px; }
    .bulk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .bulk-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
    .bulk-btn.ignore-all { color: var(--accent); border-color: var(--accent); }
    .bulk-btn.unignore-all { color: var(--ignore-on-fg); border-color: var(--ignore-on-border); }
    .bulk-btn.cancel { color: var(--muted); border-color: var(--border); }
    .bulk-btn.danger { color: var(--fail); border-color: var(--fail); }
    .bulk-btn:hover { opacity: .85; }

    /* 悬停长文本 */
    .hover-trunc { font-size: 13px; color: var(--text); border-bottom: 1px dashed var(--border); cursor: help; }

    /* 日期选择按钮 */
    .sidebar-filters #reportDateFilter { padding-right: 46px; }
    #reportDatePickerHelper { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .cal-btn {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      border: none; background: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 2px; line-height: 1;
    }
    .cal-btn:hover { color: var(--accent); }

    /* diff 高亮（字段差异对比） */
    .diff-del { background: var(--fail-bg); color: var(--fail); text-decoration: line-through; border-radius: 2px; }
    .diff-add { background: var(--pass-bg); color: var(--pass); border-radius: 2px; }

    /* 统计图表（纯 CSS） */
    .charts { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .chart-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
    .chart-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
    .chart-ring-row { display: flex; align-items: center; gap: 16px; }
    .chart-ring { width: 84px; height: 84px; border-radius: 50%; position: relative; flex: 0 0 auto; }
    .chart-ring::after { content: ''; position: absolute; inset: 12px; background: var(--surface); border-radius: 50%; }
    .chart-ring-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 16px; z-index: 1; }
    .chart-bar-row { margin: 8px 0; }
    .chart-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .chart-bar-label b { color: var(--text); font-family: var(--mono); }
    .chart-bar { height: 10px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; }
    .chart-bar-fill { height: 100%; border-radius: 999px; }

    .chart-bar-fill.fail { background: var(--fail); }
    .chart-bar-fill.warn { background: var(--bar-warn); }

    /* 对比视图 */
    .compare-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .compare-toolbar label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .compare-toolbar select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--surface); outline: none; cursor: pointer; }
    .cmp-diff { color: var(--fail); font-weight: 600; }
    .cmp-same { color: var(--pass); font-weight: 600; }
    .cmp-val { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    /* 健康总览 */
    .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .health-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
    .health-card .h-label { font-size: 12px; color: var(--muted); }

    .health-card .h-value.ok { color: var(--pass); }
    .health-card .h-value.bad { color: var(--fail); }
    .health-card .h-value.warn { color: var(--warn); }
    .health-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; table-layout: fixed; }
    .health-table th, .health-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .health-table th { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; }
    .health-table th:nth-child(1), .health-table td:nth-child(1) { width: 46%; }
    .health-table th:nth-child(2), .health-table td:nth-child(2) { width: 32%; }
    .health-table th:nth-child(3), .health-table td:nth-child(3) { width: 22%; }
    .health-count { font-family: var(--mono); font-weight: 600; }
    .health-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .health-sortable { cursor: pointer; user-select: none; }
    .health-sortable:hover { color: var(--accent); }

    .health-fold {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0 0 8px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      border-radius: 8px; padding: 5px 12px; cursor: pointer;
    }
    .health-fold:hover { color: var(--accent); border-color: var(--accent); }
    .health-fold .chev { color: var(--muted); font-size: 11px; transition: transform .15s; }
    .health-pager { display: flex; align-items: center; gap: 4px; margin: -6px 0 14px; }
    .health-pager .pg { height: 26px; min-width: 26px; font-size: 12px; }
    .health-pager .pg-info { color: var(--muted); font-size: 12px; margin-left: 4px; }

    /* 帮助弹窗（键盘快捷键） */
    .help-list { display: flex; flex-direction: column; gap: 10px; }
    .help-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .help-row kbd {
      display: inline-block; min-width: 56px; text-align: center;
      padding: 3px 8px; border: 1px solid var(--border); border-bottom-width: 2px;
      border-radius: 6px; background: var(--surface-2); color: var(--text);
      font-family: var(--mono); font-size: 12px; line-height: 1.5;
    }
    .help-row .help-desc { color: var(--muted); }
    .help-section { margin-bottom: 16px; }
    .help-section:last-child { margin-bottom: 0; }
    .help-section-title { display: flex; align-items: center; margin-bottom: 8px; }
    .help-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .help-badge-kbd { background: var(--accent-bg); color: var(--accent); }
    .help-badge-syntax { background: var(--warn-bg); color: var(--warn); }
    .help-badge-regex { background: var(--indigo-bg); color: var(--indigo-fg); }
    .help-note { color: var(--muted); font-size: 12px; margin: 0 0 10px; padding: 8px 10px; background: var(--surface-2); border: 1px dashed var(--border); border-radius: 8px; }
    .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
    .tool-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .tool-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* 悬浮迷你摘要条（吸顶标题栏左上角的玻璃胶囊） */
    .mini-summary {
      position: fixed; top: 10px; left: 14px; z-index: 45;
      display: flex; align-items: center; gap: 12px;
      background: rgba(10, 16, 28, .55); color: #fff;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);

    .mini-summary.show { opacity: 1; transform: none; }

    .mini-summary .ok { color: #4ade80; }
    .mini-summary .bad { color: #fb7185; }
    .mini-summary .warn { color: #fbbf24; }

    /* 侧栏折叠 */
    .sidebar-head-right { display: inline-flex; align-items: center; gap: 8px; }
    .side-collapse {
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      border-radius: 6px; cursor: pointer; font-size: 13px; padding: 0 8px; line-height: 22px;
    }
    .side-collapse:hover { color: var(--accent); border-color: var(--accent); }
    body.sidebar-collapsed .layout { grid-template-columns: 1fr; gap: 0; }
    body.sidebar-collapsed .sidebar { display: none; }
    .side-expand {
      position: fixed; left: 10px; top: 50%; transform: translateY(-50%); z-index: 25;
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      border-radius: 999px; width: 34px; height: 34px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.16); font-size: 15px; display: none;
    }
    .side-expand:hover { color: var(--accent); border-color: var(--accent); }
    body.sidebar-collapsed .side-expand { display: block; }
    .side-resize { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 3; }
    .side-resize::after { content: ''; position: absolute; right: 2px; top: 0; width: 2px; height: 100%; }
    .side-resize:hover::after, body.side-resizing .side-resize::after { background: var(--accent); }
    body.side-resizing { cursor: col-resize; user-select: none; }

    /* 顶部区域折叠（统计 + 筛选 + 搜索） */
    .top-collapse { border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 8px; padding: 2px 10px; cursor: pointer; font-size: 14px; line-height: 22px; }
    .top-collapse:hover { color: var(--accent); border-color: var(--accent); }
    .item-bar .top-collapse { align-self: center; flex: 0 0 auto; }
    body.top-collapsed #topRegion { display: none; }

    /* 字段详情弹窗：item 上下文 + 返回按钮 */
    .modal-head-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
    .modal-head-right { display: flex; align-items: center; gap: 10px; }
    .modal-item-chip { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-weight: 500; }
    .modal-goto { border: 1px solid var(--border); background: var(--surface); color: var(--accent); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .modal-goto:hover { border-color: var(--accent); }
    @keyframes flashRing { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }
    .detail.flash { animation: flashRing 1.2s ease; }

    /* 自定义滚动条 */
    * { scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text); background-clip: padding-box; }

    /* 安全动效（仅 transform/opacity/box-shadow/border-color，避免 background 过渡） */
    .tab, .ctab { transition: transform .12s, border-color .12s, color .12s; }
    .tab:hover, .ctab:hover { transform: translateY(-1px); }
    .modal-backdrop { animation: fadeIn .16s ease; }
    .modal { animation: slideUp .18s ease; }
    .popover { animation: popIn .12s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    /* 回到顶部 / 加载遮罩 / 减少动效 */
    .back-top {
      position: fixed; right: 22px; bottom: 26px; z-index: 28;
      width: 42px; height: 42px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: pointer; font-size: 16px;
      opacity: 0; pointer-events: none; transform: translateY(10px);
      transition: opacity .2s, transform .2s, color .15s, border-color .15s;
    }
    .back-top:hover { color: var(--accent); border-color: var(--accent); }
    .back-top.show { opacity: 1; pointer-events: auto; transform: none; }
    .boot {

    .skel {

    .skel-topbar { height: 88px; border-radius: 0; }

    .skel-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .skel-card { height: 88px; }
    .skel-bar { height: 52px; margin-bottom: 16px; }
    .skel-cols { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: stretch; }
    .skel-side, .skel-main { height: 560px; }
    @media (max-width: 920px) { .skel-cols { grid-template-columns: 1fr; } }

    @media (max-width: 920px) {

    /* 平台/产品联动弹层 */
    .pop-cat { font-size: 11px; color: var(--muted); font-weight: 600; margin: 8px 0 2px; }
    .col-option.cat-sub { padding-left: 18px; }

    /* 报告日期选择弹层 */
    .date-list { max-height: 240px; overflow: auto; }
    .date-option { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 8px; font-size: 13px; cursor: pointer; border-radius: 6px; font-family: var(--mono); }
    .date-option:hover { background: var(--hover); }
    .date-option.active { background: var(--accent-bg); color: var(--accent); }

    /* 健康总览日期栏 */

    .health-datebar select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 13px; outline: none; cursor: pointer; }

    /* 可访问性：键盘焦点圈 */

    .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .item-meta-link:hover { color: var(--accent); }
    .item-info-row { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; align-items: baseline; }
    .item-info-row .iir-label { color: var(--muted); flex: 0 0 auto; }
    .item-info-row .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .gs-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; flex-wrap: wrap; }
    .gs-row:hover { background: var(--hover); }
    .gs-item { font-weight: 600; }
    .gs-snippet { color: var(--muted); font-size: 12px; }

    /* Ctx 列拖拽调宽 */
    th.col-resizable { position: relative; }
    .col-resize { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: col-resize; z-index: 2; }

    .col-resize:hover::after, body.col-resizing .col-resize::after { background: var(--accent); }

    .top-select {

      border-radius: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer; outline: none;

    .help-btn {
      width: 30px; height: 30px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.14);
      color: #fff; cursor: pointer; font-size: 15px; font-weight: 700; line-height: 1;

  <script>
    /* ============================================================
     * 数据模型说明
     * item (tradeId) -> 报告渠道 (HKTR/JSFA/CFTC)
     *   -> 来源渠道 (A/B, 各有一套字段映射)
     *     -> 字段比较结果 { f, xpath, type, ctx, eo, ao, result, note, prints }
     * item 级别: reportDate / generatedAt / overviewLogs
     * 报告渠道级别: files / warnings[] / errors[] / uncompared[] / logs[]
     * ============================================================ */

    const TYPE_META = {
      platformAssertion: { label: '平台断言', cls: 'tp-platform' },
      productAssertion:  { label: '产品断言', cls: 'tp-product' },
      contextAssertion:  { label: '上下文断言', cls: 'tp-context' },
    };

    const ERROR_TYPE_META = {
      xpathError:      { label: 'errXpath',      cls: 'er-xpath' },
      conversionError: { label: 'errConversion', cls: 'er-conversion' },
      mappingError:    { label: 'errMapping',    cls: 'er-mapping' },
      runtimeError:    { label: 'errRuntime',    cls: 'er-runtime' },
      bufferError:     { label: 'errBuffer',     cls: 'er-buffer' },
    };

    const CHANNELS = [
      { name: 'HKTR', desc: '香港交易资料储存库', format: 'xml' },
      { name: 'JSFA', desc: '日本金融厅', format: 'xml' },
      { name: 'CFTC', desc: '美国商品期货交易委员会', format: 'csv' },
    ];

    // 产品类别 -> 子产品（示例：利率类 IR 包含 IRS/OIS/BSW 等）
    const PRODUCT_CATEGORIES = {
      IR: { label: 'catIR', sub: ['IRS', 'OIS', 'BSW'] },
      CD: { label: 'catCD', sub: ['CDS', 'CDX'] },
      FX: { label: 'catFX', sub: ['FXS', 'FXF', 'FXO'] },
    };
    // 平台 -> 可用的产品类别（用于平台/产品联动）
    const PLATFORM_CATEGORIES = {
      'OTC-PLATFORM-A': ['IR', 'CD'],
      'OTC-PLATFORM-B': ['IR', 'FX'],
      'OTC-PLATFORM-C': ['CD', 'FX'],
    };

    // 运行环境默认值（当批次索引与数据 JSON 均未提供 reportEnv 时使用）
    const DEFAULT_ENV = 'UNKNOWN';
    // 本次比较任务的说明文本（多行）
    const TASK_NOTE = '本次比较任务说明：\n1. 校验多渠道来源数据与监管报送数据的一致性。\n2. 验证配置驱动映射（Excel）与命中上下文逻辑。\n3. 回归测试多行字段与特殊字符的展示效果。';

    // 每个报告渠道的字段定义: [字段, XPath或AO CSV字段, 断言类型, 值类型]
    const FIELD_DEFS = {
      HKTR: [
        ['tradeId',      '/HKTR/Report/Header/TradeDetails/TradeIdentifier/TradeId',          'contextAssertion', 'id'],
        ['reportId',     '/HKTR/Report/Header/ReportDetails/ReportIdentifier/ReportId',        'contextAssertion', 'id'],
        ['product',      '/HKTR/Report/Product/ProductDetails/ProductIdentifier',               'productAssertion',  'product'],
        ['notional',     '/HKTR/Report/Notional/AmountDetails/NotionalValue',                   'productAssertion',  'num'],
        ['currency',     '/HKTR/Report/Notional/AmountDetails/CurrencyCode',                    'productAssertion',  'code'],
        ['tradeDate',    '/HKTR/Report/Header/TradeDetails/TradeDate',                          'contextAssertion', 'date'],
        ['maturityDate', '/HKTR/Report/Header/TradeDetails/MaturityDate',                       'contextAssertion', 'date'],
        ['counterparty', '/HKTR/Report/Counterparty/PartyDetails/PartyName',                    'contextAssertion', 'text'],
        ['platform',     '/HKTR/Report/Execution/PlatformDetails/PlatformIdentifier',           'platformAssertion', 'text'],
        ['venue',        '/HKTR/Report/Execution/VenueDetails/VenueIdentifier',                 'platformAssertion', 'text'],
        ['price',        '/HKTR/Report/Pricing/PriceDetails/PriceValue',                        'productAssertion',  'num'],
        ['quantity',     '/HKTR/Report/Pricing/QuantityDetails/QuantityValue',                  'productAssertion',  'num'],
        ['remarks',      '/HKTR/Report/Header/AdditionalInformation/Remarks',                   'contextAssertion', 'multi'],
      ],
      JSFA: [
        ['tradeId',        '/JSFA/Report/Header/TransactionDetails/TradeIdentifier/TradeId',     'contextAssertion', 'id'],
        ['reportId',       '/JSFA/Report/Header/ReportDetails/ReportIdentifier/ReportId',        'contextAssertion', 'id'],
        ['product',        '/JSFA/Report/Product/ProductDetails/ProductIdentifier',              'productAssertion',  'product'],
        ['notional',       '/JSFA/Report/Notional/AmountDetails/NotionalValue',                  'productAssertion',  'num'],
        ['currency',       '/JSFA/Report/Notional/AmountDetails/CurrencyCode',                   'productAssertion',  'code'],
        ['tradeDate',      '/JSFA/Report/Header/TransactionDetails/TradeDate',                   'contextAssertion', 'date'],
        ['settlementDate', '/JSFA/Report/Header/SettlementDetails/SettlementDate',               'contextAssertion', 'date'],
        ['counterparty',   '/JSFA/Report/Counterparty/PartyDetails/PartyName',                   'contextAssertion', 'text'],
        ['platform',       '/JSFA/Report/Execution/PlatformDetails/PlatformIdentifier',          'platformAssertion', 'text'],
        ['venue',          '/JSFA/Report/Execution/VenueDetails/VenueIdentifier',                'platformAssertion', 'text'],
        ['price',          '/JSFA/Report/Pricing/PriceDetails/PriceValue',                       'productAssertion',  'num'],
        ['quantity',       '/JSFA/Report/Pricing/QuantityDetails/QuantityValue',                 'productAssertion',  'num'],
        ['remarks',        '/JSFA/Report/Header/AdditionalInformation/Remarks',                  'contextAssertion', 'multi'],
      ],
      CFTC: [
        ['tradeId',      'trade_id',              'contextAssertion', 'id'],
        ['reportId',     'report_id',             'contextAssertion', 'id'],
        ['product',      'product_code',          'productAssertion',  'product'],
        ['notional',     'notional_amount',       'productAssertion',  'num'],
        ['currency',     'ccy',                   'productAssertion',  'code'],
        ['tradeDate',    'exec_timestamp',        'contextAssertion', 'date'],
        ['maturityDate', 'expiration_date',       'contextAssertion', 'date'],
        ['counterparty', 'cp_name',               'contextAssertion', 'text'],
        ['platform',     'platform_id',           'platformAssertion', 'text'],
        ['venue',        'venue_id',              'platformAssertion', 'text'],
        ['price',        'price_amt',             'productAssertion',  'num'],
        ['quantity',     'qty',                   'productAssertion',  'num'],
        ['remarks',      'remarks',               'contextAssertion', 'multi'],
      ],
    };

    /* ---------- 示例数据生成器（真实数据可替换此部分） ---------- */
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const MULTI_TEXT =
      '第一行备注：交易双方已确认条款，包含特殊字符 <PartyRole id="P1"> & "quote" & \'single\'。</PartyRole>\n' +
      '第二行备注：本字段可能包含较长内容，用于验证多行与特殊字符的展示效果。\n' +
      '第三行备注：配置驱动比较，命中上下文后取得字段对应关系。';

    function genValue(kind, rng) {
      if (kind === 'id') return 'TX-2024-' + String(100000 + Math.floor(rng() * 900000));
      if (kind === 'num') return (100000 + rng() * 9900000).toFixed(2);
      if (kind === 'date') {
        const d = new Date(Date.UTC(2024, 0, 1) + Math.floor(rng() * 364) * 86400000);
        return d.toISOString().slice(0, 10);
      }
      if (kind === 'code') return ['USD', 'CNY', 'HKD', 'JPY', 'EUR'][Math.floor(rng() * 5)];
      if (kind === 'product') return ['IRS', 'OIS', 'BSW', 'CDS', 'FXS', 'FXF'][Math.floor(rng() * 6)];
      if (kind === 'text') {
        const roll = rng();
        if (roll < 0.08) return '';
        if (roll < 0.16) return '   ';
        if (roll < 0.24) return 'ABC\u200BBank';
        return ['ABC Bank', 'Citi Group', 'HSBC', 'Nomura', 'Goldman Sachs'][Math.floor(rng() * 5)];
      }
      if (kind === 'multi') return MULTI_TEXT;
      return 'VAL-' + Math.floor(rng() * 9999);
    }

    function mutateValue(v, kind, rng) {
      if (kind === 'num') {
        const n = parseFloat(v);
        const delta = (rng() < 0.5 ? -1 : 1) * (0.01 + Math.floor(rng() * 99));
        return (n + delta).toFixed(2);
      }
      if (kind === 'date') {
        const d = new Date(v);
        d.setUTCDate(d.getUTCDate() + 1 + Math.floor(rng() * 9));
        return d.toISOString().slice(0, 10);
      }
      if (kind === 'code') { const codes = ['USD', 'CNY', 'HKD', 'JPY', 'EUR']; return codes.find(c => c !== v) || 'GBP'; }
      if (kind === 'product') { const ps = ['IRS', 'OIS', 'BSW', 'CDS', 'FXS', 'FXF']; return ps.find(p => p !== v) || 'OPTION'; }
      if (kind === 'id') return v.slice(0, -1) + String(Math.floor(rng() * 10));
      if (kind === 'multi') return v.replace('已确认条款', '存在差异条款') + '\n[差异] 新增差异行：内容不一致。';
      const texts = ['XYZ Bank', 'Deutsche Bank', 'Mizuho', 'BNP Paribas', 'Barclays'];
      return texts.find(t => t !== v) || 'Other Bank';
    }

    function noteFor(kind) {
      if (kind === 'num') return '数值差异';
      if (kind === 'date') return '日期差异';
      if (kind === 'code' || kind === 'product') return '码值差异';
      if (kind === 'multi') return '内容差异';
      return '值不一致';
    }

    function genUnconverted(eo, k) {
      if (k === 'num') return String(Math.round(parseFloat(eo) * 100));
      if (k === 'date') return String(eo).replace(/-/g, '');
      if (k === 'code') return String(eo).toLowerCase();
      if (k === 'product') return String(eo).toLowerCase();
      if (k === 'text') return '  ' + eo + '  ';
      if (k === 'id') return String(eo).replace('TX-', '');
      return eo;
    }
    function genExcelMapping(x, ctx, isSample) {
      const keys = ctx && ctx.length ? ctx : ['ctx.default'];
      if (!isSample) return '-; ' + x;
      return keys.map(function (ck) {
        return ck + ':\n-; ' + x + '\n- boolean(' + x + ') = False';
      }).join('\n');
    }
    function genExcelRuleText(rule, ctx, isSample) {
      if (!rule) return '（未配置）';
      const keys = ctx && ctx.length ? ctx : ['ctx.default'];
      if (!isSample) return '-; ' + rule;
      return keys.map(function (ck) {
        return ck + ':\n-; ' + rule + '\n- @fallback';
      }).join('\n');
    }
    function convRuleFor(k, rng) {
      if (k === 'num') return ['@round2', '@scale100'][Math.floor(rng() * 2)];
      if (k === 'date') return '@dateFormat(YYYY-MM-DD)';
      if (k === 'code') return '@toUpper';
      if (k === 'product') return '@toUpper';
      if (k === 'text') return ['@trim', '@normalizeSpace'][Math.floor(rng() * 2)];
      if (k === 'id') return '@normalizeId';
      if (k === 'multi') return '@trimLines';
      return '@normalize';
    }
    function valRuleFor(k, rng) {
      if (k === 'code') return "enum: ['USD', 'CNY', 'HKD', 'JPY', 'EUR']";
      if (k === 'num') return 'regex:^\\d+(\\.\\d{2})?$';
      if (k === 'date') return 'regex:^\\d{4}-\\d{2}-\\d{2}$';
      if (k === 'id') return 'regex:^TX-\\d{6}$';
      if (k === 'product') return "enum: ['IRS', 'OIS', 'BSW', 'CDS', 'FXS', 'FXF']";
      if (k === 'text') return ['@length<=64', '@notNull'][Math.floor(rng() * 2)];
      if (k === 'multi') return '@maxLines<=3';
      return '@notNull';
    }
    function pickCtx(ctxPool, rng) {
      const n = rng() < 0.4 ? 2 : 1;
      const arr = [];
      for (let i = 0; i < n; i++) {
        const c = ctxPool[Math.floor(rng() * ctxPool.length)];
        if (arr.indexOf(c) === -1) arr.push(c);
      }
      return arr;
    }

    const WARN_TEXTS = [
      '配置映射缺失：CSV 字段未找到对应 XPath，已跳过',
      '字段格式与映射配置不一致，使用默认校验规则',
      '日期格式异常，已自动规范化处理',
      '空值处理：期望值为空，按容错策略判定通过',
      '关键字段重复，仅保留首条记录',
    ];
    const ERR_TEXTS = [
      'XPath 解析失败：节点不存在',
      '类型转换异常：无法转换为数值',
      '映射配置错误：XPath 语法非法',
      '运行时异常：字段比较过程被中断',
      '日志缓冲达到上限，部分日志被丢弃',
    ];

    function buildMessages(level, rng, channelName, fieldsDef, platform, product) {
      const count = 2 + Math.floor(rng() * 4);
      const pool = level === 'warning' ? WARN_TEXTS : ERR_TEXTS;
      const typeKeys = level === 'error' ? Object.keys(ERROR_TYPE_META) : Object.keys(TYPE_META);
      const levelPool = level === 'warning' ? ['WARN', 'INFO', 'NOTICE', 'DEBUG'] : ['ERROR', 'FATAL', 'SEVERE'];
      const msgs = [];
      for (let i = 0; i < count; i++) {
        const base = pool[Math.floor(rng() * pool.length)];
        const text = rng() < 0.2
          ? base + '\n详情：该字段的映射配置可能缺失或与当前 context 不匹配。\n建议检查映射表对应 sheet 的配置，确认 XPath 与命中的 context 是否正确，并核对字段类型。'
          : base;
        msgs.push({
          channel: channelName,
          platform: platform,
          product: product,
          type: typeKeys[Math.floor(rng() * typeKeys.length)],
          level: levelPool[Math.floor(rng() * levelPool.length)],
          text: text,
          field: rng() < 0.8 ? fieldsDef[Math.floor(rng() * fieldsDef.length)][0] : '',
        });
      }
      return msgs;
    }

    function buildChannelUncompared(channelName, rng, fieldsDef, platform, product) {
      const list = [];
      const n = Math.floor(rng() * 2);
      const ctxPool = [channelName.toLowerCase() + '.ctx.default', channelName.toLowerCase() + '.ctx.v2', channelName.toLowerCase() + '.ctx.v3'];
      for (let i = 0; i < n; i++) {
        const d = fieldsDef[Math.floor(rng() * fieldsDef.length)];
        const note = rng() < 0.35
          ? '未在映射配置中匹配到对应 CSV 字段\n详情：Excel 映射配置中未找到与该 XPath 对应的条目，可能因 context 定义变化导致。\n请检查映射表并确认该 XPath 是否仍需要参与比较。'
          : '未在映射配置中匹配到对应 CSV 字段';
        list.push({ channel: channelName, xpath: d[1], note: note, platform: platform, product: product, ctx: ctxPool[Math.floor(rng() * ctxPool.length)] });
      }
      return list;
    }

    function buildChannelUncomparedCsv(channelName, rng, fieldsDef, platform, product) {
      const list = [];
      const n = Math.floor(rng() * 2);
      const ctxPool = [channelName.toLowerCase() + '.ctx.default', channelName.toLowerCase() + '.ctx.v2', channelName.toLowerCase() + '.ctx.v3'];
      for (let i = 0; i < n; i++) {
        const d = fieldsDef[Math.floor(rng() * fieldsDef.length)];
        const note = rng() < 0.35
          ? '未在映射配置中匹配到对应来源字段\n详情：Excel 映射配置中未找到与该 AO CSV 字段对应的条目，可能因 context 定义变化导致。\n请检查映射表并确认该 CSV 字段是否仍需要参与比较。'
          : '未在映射配置中匹配到对应来源字段';
        list.push({ channel: channelName, csvField: d[1], note: note, platform: platform, product: product, ctx: ctxPool[Math.floor(rng() * ctxPool.length)] });
      }
      return list;
    }

    function buildChannelLogs(ch, tradeId) {
      const t = '2024-08-14 10:23:0';
      return [
        t + '0.200 INFO  [' + ch.name + '] 读取报送文件 ' + ch.files.ao.map(fileEntryName).join(', '),
        t + '0.300 INFO  [' + ch.name + '] 应用映射配置 ' + ch.files.excel.file + ' [sheet: ' + ch.files.excel.sheet + ']',
        t + '0.400 INFO  [' + ch.name + '] 完成字段比较，渠道结果已生成',
      ];
    }

    function buildPrints(f, target, ctx, chName, srcName, eo, ao, result, note, targetName) {
      return [
        '[INFO] 比较字段 ' + f + '（报告渠道 ' + chName + ' / ' + srcName + '）',
        '[INFO] ' + targetName + '=' + target + '，命中Ctx=' + (Array.isArray(ctx) ? ctx.join(',') : ctx),
        '[INFO] EO=' + eo + '，AO=' + ao + ' → ' + result + (note ? '（' + note + '）' : ''),
      ];
    }

    function buildChannelData(ch, tradeId, reportDate, rng, failRate, platform, product) {
      const fieldsDef = FIELD_DEFS[ch.name];
      const ctxPool = [
        ch.name.toLowerCase() + '.ctx.default',
        ch.name.toLowerCase() + '.ctx.v2',
        ch.name.toLowerCase() + '.ctx.v3',
        ch.name.toLowerCase() + '.ctx.extended.production.region.east.v2024.latest',
      ];
      const isCsv = ch.format === 'csv';
      const sources = [1, 2].map(sn => {
        const fields = fieldsDef.map(([f, rawTarget, t, k], idx) => {
          const x = isCsv ? '' : rawTarget;
          const aoCsv = isCsv ? rawTarget : '';
          const eo = genValue(k, rng);
          const failed = rng() < failRate;
          const ao = failed ? mutateValue(eo, k, rng) : eo;
          const ctx = [];
          const ctxCount = rng() < 0.3 ? 2 : 1;
          for (let ci = 0; ci < ctxCount; ci++) {
            const c = ctxPool[Math.floor(rng() * ctxPool.length)];
            if (ctx.indexOf(c) === -1) ctx.push(c);
          }
          const result = failed ? 'FAILED' : 'PASSED';
          let note = failed ? noteFor(k) : '';
          if (note && rng() < 0.3) note += '\n详情：期望值与实际值存在差异，可能由来源数据更新或报送数据延迟导致。\n建议核对上游系统该字段的最新取值，确认差异是否为业务允许范围。';
          const resultNote = failed ? ('比对未通过：' + note) : '比对通过';
          // EO 转换信息（Excel 转换规则）与 AO 终值校验规则
          const convProb = { num: 0.6, date: 0.5, code: 0.5, text: 0.45, product: 0.3, id: 0.2, multi: 0.15 }[k] || 0.3;
          const eoConverted = rng() < convProb;
          const eoUnconverted = eoConverted ? genUnconverted(eo, k) : null;
          const conversionRule = eoConverted ? { ctx: pickCtx(ctxPool, rng), value: convRuleFor(k, rng) } : null;
          const validationRule = rng() < 0.75 ? { ctx: pickCtx(ctxPool, rng), value: valRuleFor(k, rng) } : null;
          const isExcelSample = tradeId === 'T-20240814-1001' && ch.name === 'HKTR' && idx === 0;
          const excelMapping = genExcelMapping(isCsv ? aoCsv : x, ctx, isExcelSample);
          const excelConversionRule = genExcelRuleText(conversionRule ? conversionRule.value : null, ctx, isExcelSample);
          const excelValidationRule = genExcelRuleText(validationRule ? validationRule.value : null, ctx, isExcelSample);
          const extraResults = [];
          if (eoConverted && eoUnconverted != null) extraResults.push({ label: '期望值 (EO, Unconverted)', value: eoUnconverted });
          return {
            id: ch.name + '-' + sn + '-' + idx,
            f: f, x: x, aoCsv: aoCsv, t: t, k: k, ctx: ctx,
            eo: eo, ao: ao,
            result: result, note: note, resultNote: resultNote,
            eoConverted: eoConverted, eoUnconverted: eoUnconverted,
            extraResults: extraResults,
            conversionRule: conversionRule, validationRule: validationRule,
            excelMapping: excelMapping, excelConversionRule: excelConversionRule, excelValidationRule: excelValidationRule,
            prints: buildPrints(f, isCsv ? aoCsv : x, ctx, ch.name, '来源渠道 ' + (sn === 1 ? 'A' : 'B'), eo, ao, result, note, isCsv ? 'CSV字段' : 'XPath'),
          };
        });
        return { name: '来源渠道 ' + (sn === 1 ? 'A' : 'B'), fields: fields };
      });

      const aoExt = isCsv ? '.csv' : '.xml';
      const eoNameA = ch.name.toLowerCase() + '_srcA_' + tradeId + '.csv';
      const eoNameB = ch.name.toLowerCase() + '_srcB_' + tradeId + '.csv';
      const aoNameA = ch.name.toUpperCase() + '_' + tradeId + '_001' + aoExt;
      const aoNameB = ch.name.toUpperCase() + '_' + tradeId + '_002' + aoExt;
      const files = {
        eo: [
          { name: eoNameA, path: 'data/eo/' + eoNameA },
          { name: eoNameB, path: 'data/eo/' + eoNameB },
        ],
        ao: [
          { name: aoNameA, path: 'data/ao/' + aoNameA },
          { name: aoNameB, path: 'data/ao/' + aoNameB },
        ],
        excel: { file: 'mapping.xlsx', sheet: ch.name, path: 'data/excel/mapping.xlsx' },
      };

      return {
        name: ch.name, desc: ch.desc, format: ch.format, files: files, sources: sources,
        warnings: buildMessages('warning', rng, ch.name, fieldsDef, platform, product),
        errors: buildMessages('error', rng, ch.name, fieldsDef, platform, product),
        uncompared: isCsv ? [] : buildChannelUncompared(ch.name, rng, fieldsDef, platform, product),
        uncomparedCsv: isCsv ? buildChannelUncomparedCsv(ch.name, rng, fieldsDef, platform, product) : [],
        logs: buildChannelLogs({ name: ch.name, files: files }, tradeId),
      };
    }

    function buildSkippedItems(reportDate, rng) {
      const list = [];
      const n = 1 + Math.floor(rng() * 3);
      const chNames = ['HKTR', 'JSFA', 'CFTC'];
      for (let i = 0; i < n; i++) {
        const withChannel = rng() < 0.55;
        const ch = withChannel ? chNames[Math.floor(rng() * chNames.length)] : 'ALL';
        const itemId = 'T-' + reportDate.replace(/-/g, '') + '-0' + (91 + i);
        let reason;
        if (ch === 'ALL') reason = '未在任一报告渠道中找到对应记录，该 item 未能参与比较。';
        else reason = '在 ' + ch + ' 渠道中未找到该 item 的对应记录，已跳过该渠道的比较。';
        if (rng() < 0.35) reason += '\n详情：该 item 在来源 CSV 与报送 XML 中均未出现对应记录，可能因数据采集或报送延迟导致。\n建议核对上游系统是否已产生该 item 的数据。';
        list.push({ itemId: itemId, channel: ch, reason: reason });
      }
      return list;
    }

        lines.push('2024-08-14 10:23:' + String(i).padStart(2, '0') + '.' + ms + ' INFO  [' + ch.name + '] 执行字段比较步骤 ' + (i + 1) + '：读取 ' + fileEntryName(ch.files.eo[0]) + ' 与 ' + fileEntryName(ch.files.ao[0]) + '，逐字段校验映射关系。');

        const generatedAt = '2024-08-14 10:23:0' + (i % 10) + '.000';
        const failRate = i === 0 ? 0 : (i === 2 ? 0.85 : 0.18);
        const platform = platforms[i % platforms.length];
        const cats = PLATFORM_CATEGORIES[platform] || Object.keys(PRODUCT_CATEGORIES);
        const productCategory = cats[i % cats.length];
        const subProducts = PRODUCT_CATEGORIES[productCategory].sub;
        const product = subProducts[Math.floor(rng() * subProducts.length)];
        const counterpartyItemId = (Math.floor(i / 2) === 5) ? '' : (i % 2 === 0 ? 'T-20240814-' + String(1002 + i) : 'T-20240814-' + String(1000 + i));
        const channels = CHANNELS.map(ch => buildChannelData(ch, tradeId, reportDate, rng, failRate, platform, product));
        items.push({
          tradeId: tradeId,

          counterpartyItemId: counterpartyItemId,
