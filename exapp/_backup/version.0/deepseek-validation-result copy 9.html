<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融监管报告比较 · 结果展示</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --pass: #16a34a;
      --pass-bg: #dcfce7;
      --fail: #dc2626;
      --fail-bg: #fee2e2;
      --warn: #d97706;
      --warn-bg: #fef3c7;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* 顶栏 */
    .topbar {
      background: linear-gradient(120deg, #0b1f3a 0%, #1e3a8a 55%, #2563eb 100%);
      color: #fff;
      padding: 18px 24px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .18);
    }
    .topbar-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .topbar-title { font-size: 21px; font-weight: 700; letter-spacing: .3px; }
    .topbar-title .accent { color: #7dd3fc; }
    .topbar-sub { font-size: 13px; color: rgba(255,255,255,.72); margin-top: 4px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .env-badge {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: #fde68a;
      border-radius: 999px; padding: 5px 14px; font-size: 12px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .env-badge::before { content: '●'; font-size: 8px; color: #4ade80; }

    .page { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }

    /* 统计卡片 */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .card-label { color: var(--muted); font-size: 12px; }
    .card-value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .card-value.ok { color: var(--pass); }
    .card-value.bad { color: var(--fail); }
    .card-value.warn { color: var(--warn); }

    /* 工具栏 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .toolbar input[type="search"] {
      flex: 1 1 240px;
      min-width: 180px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .toolbar input[type="search"]:focus { border-color: var(--accent); }
    .toolbar select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .toolbar select:disabled { opacity: .45; cursor: not-allowed; }

    /* 主体布局 */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: stretch;
    }
    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* 侧栏 item 列表 */
    .sidebar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .sidebar-head {
      padding: 12px 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-head .count {
      background: #eef2ff;
      color: #4338ca;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
    }
    .item { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #f9fafb; }
    .item.active { background: #eff6ff; box-shadow: inset 3px 0 0 var(--accent); }
    .item-id { font-weight: 600; font-family: var(--mono); }
    .item-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bar { height: 6px; background: #eef0f3; border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--pass); border-radius: 999px; }

    /* 详情区 */
    .detail {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .detail-head { padding: 16px 18px 0; }
    .detail-head h2 { margin: 0; font-size: 18px; font-family: var(--mono); }
    .detail-head .channels { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .tab {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab:hover { border-color: var(--accent); color: var(--accent); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab-count {
      background: rgba(0,0,0,.08);
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
    }
    .tab.active .tab-count { background: rgba(255,255,255,.25); }

    .channel-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 18px 0;
    }
    .ctab {
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ctab:hover { border-color: var(--accent); color: var(--accent); }
    .ctab.active { background: #eef2ff; border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .ctab-count { color: var(--muted); font-size: 12px; }
    .ctab.active .ctab-count { color: var(--accent); }

    .content { padding: 16px 18px 20px; }

    /* 表格 */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: #f9fafb; color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    tr.row-fail td { background: #fffafa; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .xpath { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 28px !important; }

    /* 徽章与芯片 */
    .chip { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
    .channel-chip { background: #eef2ff; color: #4338ca; }
    .tp-platform { background: #e0f2fe; color: #0369a1; }
    .tp-product { background: #ede9fe; color: #6d28d9; }
    .tp-context { background: #fef3c7; color: #b45309; }
    .badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
    .badge.pass { background: var(--pass-bg); color: var(--pass); }
    .badge.fail { background: var(--fail-bg); color: var(--fail); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }

    /* 分页 */
    .pagination { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .pg {
      min-width: 30px; height: 30px;
      border: 1px solid var(--border);
      background: #fff; color: var(--text);
      border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .pg:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pg.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pg:disabled { opacity: .4; cursor: not-allowed; }
    .pg-info { color: var(--muted); font-size: 12px; margin: 0 6px; }
    .pagination select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; }

    /* 日志 */
    .log-box {
      background: #0f172a; color: #d1fae5;
      border-radius: 10px; padding: 14px 16px;
      font-family: var(--mono); font-size: 12px;
      max-height: 520px; overflow: auto;
    }
    .log-line { white-space: pre-wrap; word-break: break-all; }

    .meta-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .footer-note { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; }

    /* 过滤标识 chips */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filters:empty { display: none; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #eef2ff; color: #4338ca;
      border-radius: 999px; padding: 4px 10px; font-size: 12px;
    }
    .filter-chip button {
      border: none; background: none; color: #4338ca;
      cursor: pointer; font-size: 13px; line-height: 1; padding: 0;
    }
    .filter-chip button:hover { color: #1e3a8a; }

    /* 可点击统计卡片 */
    .card.clickable { cursor: pointer; transition: box-shadow .15s, border-color .15s, background .15s; }
    .card.clickable:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.12); }
    .card.active-filter { border-color: var(--accent); background: #eff6ff; }

    /* 元信息行 */
    .meta-line { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* 文件面板 */
    .files { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: #fafbfc; }
    .files-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .files-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .file-card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: #fff; min-width: 210px; flex: 1 1 210px; }
    .file-card .fc-head { font-weight: 600; font-size: 12px; color: #4338ca; margin-bottom: 4px; }
    .file-card .fc-row { font-size: 12px; color: var(--text); font-family: var(--mono); word-break: break-all; line-height: 1.6; }
    .file-card .fc-row .fc-label { color: var(--muted); font-family: inherit; }

    /* 表头排序 + 过滤输入 */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th .sort-arrow { font-size: 10px; margin-left: 2px; color: var(--accent); }
    th .hfilter {
      margin-top: 4px; width: 100%; padding: 4px 6px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; font-weight: 400; color: var(--text);
      background: #fff;
    }
    th .hfilter:focus { border-color: var(--accent); outline: none; }
    th select.hfilter { padding: 4px 2px; }

    /* 值预览 */
    .val {
      max-width: 200px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-family: var(--mono); font-size: 12px;
      display: inline-block; vertical-align: middle;
    }
    .val-link { color: var(--accent); cursor: pointer; text-decoration: none; }
    .val-link:hover { text-decoration: underline; }

    /* 详情弹窗 */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 20px;
    }
    .modal {
      background: #fff; border-radius: 12px; max-width: 880px; width: 100%;
      max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { margin: 0; font-size: 16px; }
    .modal-close { border: none; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px 18px; overflow: auto; }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; margin-bottom: 14px; font-size: 13px; }
    .kv .k { color: var(--muted); }
    .kv .v { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pair-box { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .pair-box .pb-head { background: #f9fafb; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
    .pair-box pre { margin: 0; padding: 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow: auto; }
    .print-box { margin-top: 14px; }
    .print-box .pb-head { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .print-box .print-line { font-family: var(--mono); font-size: 12px; color: #334155; white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }

    /* item 元信息栏 */
    .item-bar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .item-bar h2 { margin: 0; font-size: 18px; font-family: var(--mono); }
    .item-bar .meta-line { margin-top: 0; }

    /* 可折叠报告信息 */
    .collapse-toggle {
      margin-top: 10px; border: 1px solid var(--border); background: #f9fafb;
      border-radius: 8px; padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--muted);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .collapse-toggle:hover { color: var(--accent); border-color: var(--accent); }
    .collapse-toggle .chev { transition: transform .15s; }
    .collapse-toggle.open .chev { transform: rotate(180deg); }
    .report-info { margin-top: 8px; }

    /* 侧栏过滤 */
    .sidebar-filters { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
    .sidebar-filters input, .sidebar-filters select {
      flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 12px; color: var(--text); outline: none; background: #fff;
    }
    .sidebar-filters input:focus, .sidebar-filters select:focus { border-color: var(--accent); }
    .sidebar-list { flex: 1; overflow: auto; }
    .sidebar-pager { padding: 8px 12px; border-top: 1px solid var(--border); display: flex; justify-content: center; align-items: center; gap: 4px; }
    .sidebar-pager:empty { display: none; }

    /* 表头过滤图标按钮 */
    th .hf-toggle, th .mhf-toggle, th .special-toggle, th .bulk-toggle {
      margin-left: 4px; border: none; background: none; cursor: pointer;
      color: var(--muted); font-size: 12px; padding: 0 2px; vertical-align: middle;
    }
    th .hf-toggle:hover, th .hf-toggle.active, th .mhf-toggle:hover, th .mhf-toggle.active, th .special-toggle:hover, th .special-toggle.active, th .bulk-toggle:hover { color: var(--accent); }

    /* 浮层 popover */
    .popover {
      position: fixed; z-index: 40; background: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    .pop-control {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text); outline: none; box-sizing: border-box; background: #fff;
    }
    .pop-control:focus { border-color: var(--accent); }
    .col-option { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: 13px; cursor: pointer; border-radius: 6px; }
    .col-option:hover { background: #f3f4f6; }
    .popover-title { font-size: 12px; color: var(--muted); margin: 0 0 6px; }

    /* 字段工具栏 */
    .fields-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .col-toggle {
      border: 1px solid var(--border); background: #fff; border-radius: 8px;
      padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--muted);
    }
    .col-toggle:hover, .col-toggle.active { color: var(--accent); border-color: var(--accent); }
    .fields-count { color: var(--muted); font-size: 12px; }

    /* item 属性芯片 */
    .attr-chip { background: #eef2ff; color: #4338ca; border-radius: 6px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }

    /* 任务说明 */
    .task-note { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
    .task-note-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .task-note-text { font-size: 13px; white-space: pre-wrap; word-break: break-word; color: var(--text); }

    /* 侧栏多选按钮 */
    .sidebar-filters { flex-wrap: wrap; }
    .sidebar-filters input[type="search"] { flex: 1 1 100%; }
    .sidebar-filters select { flex: 1 1 auto; }
    .sidebar-filters .search-wrap { flex: 1 1 100%; position: relative; }
    .sidebar-filters .search-wrap input { width: 100%; }
    .sidebar-filters .search-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: none; background: none; color: var(--muted); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 2px; display: none;
    }
    .sidebar-filters .search-wrap.has-value .search-clear { display: block; }
    .side-multi {
      border: 1px solid var(--border); background: #fff; border-radius: 8px;
      padding: 6px 8px; cursor: pointer; font-size: 12px; color: var(--muted); flex: 0 0 auto;
    }
    .side-multi:hover, .side-multi.active { color: var(--accent); border-color: var(--accent); }
    .side-multi.has-filter { color: var(--accent); border-color: var(--accent); background: #eff6ff; }
    .channel-tabs .col-toggle { margin-left: auto; }

    /* 侧栏过滤 chips */
    .sidebar-chips { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; }
    .sidebar-chips:empty { display: none; }

    /* 值单元格展开 */
    .val-full { font-family: var(--mono); font-size: 12px; word-break: break-word; }
    .val-details { display: inline-block; max-width: 300px; vertical-align: middle; }
    .val-details summary {
      cursor: pointer; color: var(--accent); font-family: var(--mono); font-size: 12px;
      list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px;
    }
    .val-details summary::-webkit-details-marker { display: none; }
    .val-details summary::before { content: '▸ '; }
    .val-details[open] summary::before { content: '▾ '; }
    .val-details pre {
      margin: 4px 0 0; padding: 6px 8px; background: #f9fafb;
      border: 1px solid var(--border); border-radius: 6px;
      font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
      max-height: 220px; overflow: auto; max-width: 420px;
    }

    /* 高亮 */
    mark { background: #fde68a; color: inherit; padding: 0 1px; border-radius: 2px; }

    /* 进度条警告色 */
    .bar-fill.bar-warn { background: #eab308; }

    /* 忽略行与按钮 */
    tr.row-ignored td { background: #f3f4f6 !important; color: #9ca3af !important; }
    tr.row-ignored td .chip, tr.row-ignored td .badge { opacity: .55; }
    .ignore-btn {
      border: 1px solid var(--border); background: #fff; border-radius: 6px;
      padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap;
    }
    .ignore-btn:hover { color: var(--accent); border-color: var(--accent); }
    .ignore-btn.ignored { color: #16a34a; border-color: #86efac; background: #f0fdf4; }

    /* 文本长内容展开 */
    .text-full { font-size: 13px; word-break: break-word; }
    .text-details { display: inline-block; max-width: 480px; vertical-align: top; }
    .text-details summary {
      cursor: pointer; color: var(--accent); font-size: 13px; list-style: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px;
    }
    .text-details summary::-webkit-details-marker { display: none; }
    .text-details summary::before { content: '▸ '; }
    .text-details[open] summary::before { content: '▾ '; }
    .text-details pre {
      margin: 4px 0 0; padding: 6px 8px; background: #f9fafb; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; white-space: pre-wrap; word-break: break-word;
      max-height: 200px; overflow: auto; max-width: 560px; font-family: inherit;
    }

    /* 警告页签工具栏 */
    .warn-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .warn-toolbar:empty { display: none; }
    .export-btn {
      border: 1px solid var(--border); background: #fff; border-radius: 8px;
      padding: 5px 12px; cursor: pointer; font-size: 12px; color: var(--muted);
    }
    .export-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* 警告统计第二数字置灰 */
    .num-muted { color: #9ca3af; font-weight: 400; }

    /* 禁用渠道页签 */
    .ctab.disabled { opacity: .55; }

    /* 命中Ctx 标签 */
    .ctx-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .ctx-chip { background: #ecfdf5; color: #047857; white-space: normal; word-break: break-all; max-width: 220px; }

    /* 未启用渠道提示 */
    .channel-disabled { padding: 40px 20px; text-align: center; }
    .channel-disabled .cd-title { font-size: 16px; font-weight: 600; color: var(--muted); }
    .channel-disabled .cd-desc { margin-top: 10px; font-size: 13px; color: var(--muted); }

    /* 批量忽略确认对话框 */
    .bulk-desc { font-size: 13px; color: var(--text); margin: 0 0 16px; }
    .bulk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .bulk-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
    .bulk-btn.ignore-all { color: var(--accent); border-color: var(--accent); }
    .bulk-btn.unignore-all { color: #16a34a; border-color: #86efac; }
    .bulk-btn:hover { opacity: .85; }

    /* 悬停长文本 */
    .hover-trunc { font-size: 13px; color: var(--text); border-bottom: 1px dashed var(--border); cursor: help; }

    /* 日期选择按钮 */
    .sidebar-filters #reportDateFilter { padding-right: 46px; }
    #reportDatePickerHelper { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .cal-btn {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      border: none; background: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 2px; line-height: 1;
    }
    .cal-btn:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="topbar-title">金融监管报告<span class="accent">比较结果</span></div>
        <div class="topbar-sub">多渠道来源数据（CSV）与监管报送数据（XML） · 逐渠道 / 逐行 / 逐字段比对</div>
      </div>
      <div class="topbar-right">
        <span class="env-badge" id="envBadge"></span>
      </div>
    </div>
  </header>

  <div class="page">
    <section class="summary" id="summary"></section>

    <div class="filters" id="filterChips"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="搜索 字段 / XPath / 期望值 / 实际值 / Ctx / 信息…">
    </div>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">比较 item 列表<span class="count" id="itemCount">0</span></div>
        <div class="sidebar-filters">
          <div class="search-wrap">
            <input type="search" id="itemSearch" placeholder="搜索 item id / 报告日期 / 平台 / 产品…">
            <button class="search-clear" id="itemSearchClear" title="清除">✕</button>
          </div>
          <div class="search-wrap">
            <input type="text" id="reportDateFilter" placeholder="YYYY-mm-dd" inputmode="numeric" maxlength="10" title="按报告日期筛选（YYYY-mm-dd）">
            <input type="date" id="reportDatePickerHelper" tabindex="-1" aria-hidden="true">
            <button class="search-clear" id="reportDateClear" title="清除日期">✕</button>
            <button class="cal-btn" id="reportDateCal" title="选择日期">📅</button>
          </div>
          <select id="itemFilter">
            <option value="ALL">全部状态</option>
            <option value="PASSED">全部通过</option>
            <option value="FAILED">存在失败</option>
            <option value="WARN">存在警告</option>
          </select>
          <button class="side-multi" id="platformFilterBtn" data-field="itemPlatforms">平台 ▾</button>
          <button class="side-multi" id="productFilterBtn" data-field="itemProducts">产品 ▾</button>
        </div>
        <div class="sidebar-chips" id="sidebarChips"></div>
        <div class="sidebar-list" id="sidebarList"></div>
        <div class="sidebar-pager" id="sidebarPager"></div>
      </aside>
      <section class="detail">
        <div class="detail-head">
          <div class="item-bar">
            <h2 id="itemMeta"></h2>
            <div class="meta-line" id="reportMeta"></div>
          </div>
          <button class="collapse-toggle" id="reportInfoToggle">报告信息 <span class="chev">▾</span></button>
          <div class="report-info" id="reportInfo" style="display:none">
            <div class="channels" id="channelMeta"></div>
            <div class="files" id="filesPanel"></div>
            <div class="task-note" id="taskNote"></div>
          </div>
          <div class="tabs" id="tabs"></div>
          <div class="channel-tabs" id="channelTabs"></div>
        </div>
        <div class="content" id="content"></div>
      </section>
    </main>

    <p class="footer-note">示例数据为内置生成器产出，可替换为真实比对结果 JSON。</p>
  </div>

  <script>
    /* ============================================================
     * 数据模型说明
     * item (tradeId) -> 报告渠道 (HKTR/JSFA/CFTC)
     *   -> 来源渠道 (A/B, 各有一套字段映射)
     *     -> 字段比较结果 { f, xpath, type, ctx, eo, ao, result, note, prints }
     * item 级别: reportDate / generatedAt / overviewLogs
     * 报告渠道级别: files / warnings[] / errors[] / uncompared[] / logs[]
     * ============================================================ */

    const TYPE_META = {
      platformAssertion: { label: '平台断言', cls: 'tp-platform' },
      productAssertion:  { label: '产品断言', cls: 'tp-product' },
      contextAssertion:  { label: '上下文断言', cls: 'tp-context' },
    };

    const CHANNELS = [
      { name: 'HKTR', desc: '香港交易资料储存库' },
      { name: 'JSFA', desc: '日本金融厅' },
      { name: 'CFTC', desc: '美国商品期货交易委员会' },
    ];

    // 整份报告的运行环境（所有 item 同属该环境）
    const ENV = 'OTCXXX';
    // 本次比较任务的说明文本（多行）
    const TASK_NOTE = '本次比较任务说明：\n1. 校验多渠道来源数据与监管报送数据的一致性。\n2. 验证配置驱动映射（Excel）与命中上下文逻辑。\n3. 回归测试多行字段与特殊字符的展示效果。';

    // 每个报告渠道的字段定义: [字段, XPath, 断言类型, 值类型]
    const FIELD_DEFS = {
      HKTR: [
        ['tradeId',      '/HKTR/Report/Header/TradeDetails/TradeIdentifier/TradeId',          'contextAssertion', 'id'],
        ['reportId',     '/HKTR/Report/Header/ReportDetails/ReportIdentifier/ReportId',        'contextAssertion', 'id'],
        ['product',      '/HKTR/Report/Product/ProductDetails/ProductIdentifier',               'productAssertion',  'product'],
        ['notional',     '/HKTR/Report/Notional/AmountDetails/NotionalValue',                   'productAssertion',  'num'],
        ['currency',     '/HKTR/Report/Notional/AmountDetails/CurrencyCode',                    'productAssertion',  'code'],
        ['tradeDate',    '/HKTR/Report/Header/TradeDetails/TradeDate',                          'contextAssertion', 'date'],
        ['maturityDate', '/HKTR/Report/Header/TradeDetails/MaturityDate',                       'contextAssertion', 'date'],
        ['counterparty', '/HKTR/Report/Counterparty/PartyDetails/PartyName',                    'contextAssertion', 'text'],
        ['platform',     '/HKTR/Report/Execution/PlatformDetails/PlatformIdentifier',           'platformAssertion', 'text'],
        ['venue',        '/HKTR/Report/Execution/VenueDetails/VenueIdentifier',                 'platformAssertion', 'text'],
        ['price',        '/HKTR/Report/Pricing/PriceDetails/PriceValue',                        'productAssertion',  'num'],
        ['quantity',     '/HKTR/Report/Pricing/QuantityDetails/QuantityValue',                  'productAssertion',  'num'],
        ['remarks',      '/HKTR/Report/Header/AdditionalInformation/Remarks',                   'contextAssertion', 'multi'],
      ],
      JSFA: [
        ['tradeId',        '/JSFA/Report/Header/TransactionDetails/TradeIdentifier/TradeId',     'contextAssertion', 'id'],
        ['reportId',       '/JSFA/Report/Header/ReportDetails/ReportIdentifier/ReportId',        'contextAssertion', 'id'],
        ['product',        '/JSFA/Report/Product/ProductDetails/ProductIdentifier',              'productAssertion',  'product'],
        ['notional',       '/JSFA/Report/Notional/AmountDetails/NotionalValue',                  'productAssertion',  'num'],
        ['currency',       '/JSFA/Report/Notional/AmountDetails/CurrencyCode',                   'productAssertion',  'code'],
        ['tradeDate',      '/JSFA/Report/Header/TransactionDetails/TradeDate',                   'contextAssertion', 'date'],
        ['settlementDate', '/JSFA/Report/Header/SettlementDetails/SettlementDate',               'contextAssertion', 'date'],
        ['counterparty',   '/JSFA/Report/Counterparty/PartyDetails/PartyName',                   'contextAssertion', 'text'],
        ['platform',       '/JSFA/Report/Execution/PlatformDetails/PlatformIdentifier',          'platformAssertion', 'text'],
        ['venue',          '/JSFA/Report/Execution/VenueDetails/VenueIdentifier',                'platformAssertion', 'text'],
        ['price',          '/JSFA/Report/Pricing/PriceDetails/PriceValue',                       'productAssertion',  'num'],
        ['quantity',       '/JSFA/Report/Pricing/QuantityDetails/QuantityValue',                 'productAssertion',  'num'],
        ['remarks',        '/JSFA/Report/Header/AdditionalInformation/Remarks',                  'contextAssertion', 'multi'],
      ],
      CFTC: [
        ['tradeId',      '/CFTC/Data/Header/SwapDetails/UniqueSwapIdentifier',                   'contextAssertion', 'id'],
        ['reportId',     '/CFTC/Data/Header/ReportDetails/ReportIdentifier/ReportId',            'contextAssertion', 'id'],
        ['product',      '/CFTC/Data/Product/ProductDetails/ProductIdentifier',                  'productAssertion',  'product'],
        ['notional',     '/CFTC/Data/Notional/AmountDetails/NotionalValue',                      'productAssertion',  'num'],
        ['currency',     '/CFTC/Data/Notional/AmountDetails/CurrencyCode',                       'productAssertion',  'code'],
        ['tradeDate',    '/CFTC/Data/Header/SwapDetails/ExecutionTimestamp',                     'contextAssertion', 'date'],
        ['maturityDate', '/CFTC/Data/Header/SwapDetails/ExpirationDate',                         'contextAssertion', 'date'],
        ['counterparty', '/CFTC/Data/Counterparty/PartyDetails/PartyName',                       'contextAssertion', 'text'],
        ['platform',     '/CFTC/Data/Execution/PlatformDetails/PlatformIdentifier',              'platformAssertion', 'text'],
        ['venue',        '/CFTC/Data/Execution/VenueDetails/VenueIdentifier',                    'platformAssertion', 'text'],
        ['price',        '/CFTC/Data/Pricing/PriceDetails/PriceValue',                           'productAssertion',  'num'],
        ['quantity',     '/CFTC/Data/Pricing/QuantityDetails/QuantityValue',                     'productAssertion',  'num'],
        ['remarks',      '/CFTC/Data/Header/AdditionalInformation/Remarks',                      'contextAssertion', 'multi'],
      ],
    };

    /* ---------- 示例数据生成器（真实数据可替换此部分） ---------- */
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const MULTI_TEXT =
      '第一行备注：交易双方已确认条款，包含特殊字符 <PartyRole id="P1"> & "quote" & \'single\'。</PartyRole>\n' +
      '第二行备注：本字段可能包含较长内容，用于验证多行与特殊字符的展示效果。\n' +
      '第三行备注：配置驱动比较，命中上下文后取得字段对应关系。';

    function genValue(kind, rng) {
      if (kind === 'id') return 'TX-2024-' + String(100000 + Math.floor(rng() * 900000));
      if (kind === 'num') return (100000 + rng() * 9900000).toFixed(2);
      if (kind === 'date') {
        const d = new Date(Date.UTC(2024, 0, 1) + Math.floor(rng() * 364) * 86400000);
        return d.toISOString().slice(0, 10);
      }
      if (kind === 'code') return ['USD', 'CNY', 'HKD', 'JPY', 'EUR'][Math.floor(rng() * 5)];
      if (kind === 'product') return ['IRS', 'CDS', 'FXS', 'SWAP', 'FORWARD'][Math.floor(rng() * 5)];
      if (kind === 'text') {
        const roll = rng();
        if (roll < 0.08) return '';
        if (roll < 0.16) return '   ';
        if (roll < 0.24) return 'ABC\u200BBank';
        return ['ABC Bank', 'Citi Group', 'HSBC', 'Nomura', 'Goldman Sachs'][Math.floor(rng() * 5)];
      }
      if (kind === 'multi') return MULTI_TEXT;
      return 'VAL-' + Math.floor(rng() * 9999);
    }

    function mutateValue(v, kind, rng) {
      if (kind === 'num') {
        const n = parseFloat(v);
        const delta = (rng() < 0.5 ? -1 : 1) * (0.01 + Math.floor(rng() * 99));
        return (n + delta).toFixed(2);
      }
      if (kind === 'date') {
        const d = new Date(v);
        d.setUTCDate(d.getUTCDate() + 1 + Math.floor(rng() * 9));
        return d.toISOString().slice(0, 10);
      }
      if (kind === 'code') { const codes = ['USD', 'CNY', 'HKD', 'JPY', 'EUR']; return codes.find(c => c !== v) || 'GBP'; }
      if (kind === 'product') { const ps = ['IRS', 'CDS', 'FXS', 'SWAP', 'FORWARD']; return ps.find(p => p !== v) || 'OPTION'; }
      if (kind === 'id') return v.slice(0, -1) + String(Math.floor(rng() * 10));
      if (kind === 'multi') return v.replace('已确认条款', '存在差异条款') + '\n[差异] 新增差异行：内容不一致。';
      const texts = ['XYZ Bank', 'Deutsche Bank', 'Mizuho', 'BNP Paribas', 'Barclays'];
      return texts.find(t => t !== v) || 'Other Bank';
    }

    function noteFor(kind) {
      if (kind === 'num') return '数值差异';
      if (kind === 'date') return '日期差异';
      if (kind === 'code' || kind === 'product') return '码值差异';
      if (kind === 'multi') return '内容差异';
      return '值不一致';
    }

    const WARN_TEXTS = [
      '配置映射缺失：CSV 字段未找到对应 XPath，已跳过',
      '字段格式与映射配置不一致，使用默认校验规则',
      '日期格式异常，已自动规范化处理',
      '空值处理：期望值为空，按容错策略判定通过',
      '关键字段重复，仅保留首条记录',
    ];
    const ERR_TEXTS = [
      'XPath 解析失败：节点不存在',
      '类型转换异常：无法转换为数值',
      '映射配置错误：XPath 语法非法',
      '运行时异常：字段比较过程被中断',
      '日志缓冲达到上限，部分日志被丢弃',
    ];

    function buildMessages(level, rng, channelName, fieldsDef, platform, product) {
      const count = 2 + Math.floor(rng() * 4);
      const pool = level === 'warning' ? WARN_TEXTS : ERR_TEXTS;
      const keys = Object.keys(TYPE_META);
      const levelPool = level === 'warning' ? ['WARN', 'INFO', 'NOTICE', 'DEBUG'] : ['ERROR', 'FATAL', 'SEVERE'];
      const msgs = [];
      for (let i = 0; i < count; i++) {
        const base = pool[Math.floor(rng() * pool.length)];
        const text = rng() < 0.2
          ? base + '\n详情：该字段的映射配置可能缺失或与当前 context 不匹配。\n建议检查映射表对应 sheet 的配置，确认 XPath 与命中的 context 是否正确，并核对字段类型。'
          : base;
        msgs.push({
          channel: channelName,
          platform: platform,
          product: product,
          type: keys[Math.floor(rng() * keys.length)],
          level: levelPool[Math.floor(rng() * levelPool.length)],
          text: text,
          field: rng() < 0.8 ? fieldsDef[Math.floor(rng() * fieldsDef.length)][0] : '',
        });
      }
      return msgs;
    }

    function buildChannelUncompared(channelName, rng, fieldsDef, platform, product) {
      const list = [];
      const n = Math.floor(rng() * 2);
      const ctxPool = [channelName.toLowerCase() + '.ctx.default', channelName.toLowerCase() + '.ctx.v2', channelName.toLowerCase() + '.ctx.v3'];
      for (let i = 0; i < n; i++) {
        const d = fieldsDef[Math.floor(rng() * fieldsDef.length)];
        const note = rng() < 0.35
          ? '未在映射配置中匹配到对应 CSV 字段\n详情：Excel 映射配置中未找到与该 XPath 对应的条目，可能因 context 定义变化导致。\n请检查映射表并确认该 XPath 是否仍需要参与比较。'
          : '未在映射配置中匹配到对应 CSV 字段';
        list.push({ channel: channelName, xpath: d[1], note: note, platform: platform, product: product, ctx: ctxPool[Math.floor(rng() * ctxPool.length)] });
      }
      return list;
    }

    function buildChannelLogs(ch, tradeId) {
      const t = '2024-08-14 10:23:0';
      return [
        t + '0.200 INFO  [' + ch.name + '] 读取报送文件 ' + ch.files.ao.join(', '),
        t + '0.300 INFO  [' + ch.name + '] 应用映射配置 ' + ch.files.excel.file + ' [sheet: ' + ch.files.excel.sheet + ']',
        t + '0.400 INFO  [' + ch.name + '] 完成字段比较，渠道结果已生成',
      ];
    }

    function buildPrints(f, x, ctx, chName, srcName, eo, ao, result, note) {
      return [
        '[INFO] 比较字段 ' + f + '（报告渠道 ' + chName + ' / ' + srcName + '）',
        '[INFO] XPath=' + x + '，命中Ctx=' + (Array.isArray(ctx) ? ctx.join(',') : ctx),
        '[INFO] EO=' + eo + '，AO=' + ao + ' → ' + result + (note ? '（' + note + '）' : ''),
      ];
    }

    function buildChannelData(ch, tradeId, reportDate, rng, failRate, platform, product) {
      const fieldsDef = FIELD_DEFS[ch.name];
      const ctxPool = [
        ch.name.toLowerCase() + '.ctx.default',
        ch.name.toLowerCase() + '.ctx.v2',
        ch.name.toLowerCase() + '.ctx.v3',
        ch.name.toLowerCase() + '.ctx.extended.production.region.east.v2024.latest',
      ];
      const sources = [1, 2].map(sn => {
        const fields = fieldsDef.map(([f, x, t, k], idx) => {
          const eo = genValue(k, rng);
          const failed = rng() < failRate;
          const ao = failed ? mutateValue(eo, k, rng) : eo;
          const ctx = [];
          const ctxCount = rng() < 0.3 ? 2 : 1;
          for (let ci = 0; ci < ctxCount; ci++) {
            const c = ctxPool[Math.floor(rng() * ctxPool.length)];
            if (ctx.indexOf(c) === -1) ctx.push(c);
          }
          const result = failed ? 'FAILED' : 'PASSED';
          let note = failed ? noteFor(k) : '';
          if (note && rng() < 0.3) note += '\n详情：期望值与实际值存在差异，可能由来源数据更新或报送数据延迟导致。\n建议核对上游系统该字段的最新取值，确认差异是否为业务允许范围。';
          return {
            id: ch.name + '-' + sn + '-' + idx,
            f: f, x: x, t: t, k: k, ctx: ctx,
            eo: eo, ao: ao,
            result: result, note: note,
            prints: buildPrints(f, x, ctx, ch.name, '来源渠道 ' + (sn === 1 ? 'A' : 'B'), eo, ao, result, note),
          };
        });
        return { name: '来源渠道 ' + (sn === 1 ? 'A' : 'B'), fields: fields };
      });

      const files = {
        eo: [ch.name.toLowerCase() + '_srcA_' + tradeId + '.csv', ch.name.toLowerCase() + '_srcB_' + tradeId + '.csv'],
        ao: [ch.name.toUpperCase() + '_' + tradeId + '_001.xml', ch.name.toUpperCase() + '_' + tradeId + '_002.xml'],
        excel: { file: 'mapping.xlsx', sheet: ch.name },
      };

      return {
        name: ch.name, desc: ch.desc, files: files, sources: sources,
        warnings: buildMessages('warning', rng, ch.name, fieldsDef, platform, product),
        errors: buildMessages('error', rng, ch.name, fieldsDef, platform, product),
        uncompared: buildChannelUncompared(ch.name, rng, fieldsDef, platform, product),
        logs: buildChannelLogs({ name: ch.name, files: files }, tradeId),
      };
    }

    function buildSkippedItems(reportDate, rng) {
      const list = [];
      const n = 1 + Math.floor(rng() * 3);
      const chNames = ['HKTR', 'JSFA', 'CFTC'];
      for (let i = 0; i < n; i++) {
        const withChannel = rng() < 0.55;
        const ch = withChannel ? chNames[Math.floor(rng() * chNames.length)] : 'ALL';
        const itemId = 'T-' + reportDate.replace(/-/g, '') + '-0' + (91 + i);
        let reason;
        if (ch === 'ALL') reason = '未在任一报告渠道中找到对应记录，该 item 未能参与比较。';
        else reason = '在 ' + ch + ' 渠道中未找到该 item 的对应记录，已跳过该渠道的比较。';
        if (rng() < 0.35) reason += '\n详情：该 item 在来源 CSV 与报送 XML 中均未出现对应记录，可能因数据采集或报送延迟导致。\n建议核对上游系统是否已产生该 item 的数据。';
        list.push({ itemId: itemId, channel: ch, reason: reason });
      }
      return list;
    }

    function buildOverviewLogs(tradeId, reportDate, channels) {
      const lines = [];
      lines.push('2024-08-14 10:23:00.100 INFO  开始比较 item=' + tradeId + '，报告日期=' + reportDate);
      lines.push('2024-08-14 10:23:00.120 INFO  加载映射配置 mapping.xlsx（' + channels.length + ' 个报告渠道）');
      lines.push('2024-08-14 10:23:00.140 INFO  初始化逐渠道执行器（HKTR / JSFA / CFTC）');
      for (let i = 0; i < 60; i++) {
        const ms = String(100 + i * 7).padStart(3, '0').slice(-3);
        const ch = channels[i % channels.length];
        lines.push('2024-08-14 10:23:' + String(i).padStart(2, '0') + '.' + ms + ' INFO  [' + ch.name + '] 执行字段比较步骤 ' + (i + 1) + '：读取 ' + ch.files.eo[0] + ' 与 ' + ch.files.ao[0] + '，逐字段校验映射关系。');
      }
      lines.push('2024-08-14 10:24:00.000 INFO  比较完成，结果已生成');
      return lines;
    }

    function buildDataset() {
      const rng = mulberry32(20240814);
      const items = [];
      const platforms = ['OTC-PLATFORM-A', 'OTC-PLATFORM-B', 'OTC-PLATFORM-C'];
      const products = ['IRS', 'CDS', 'FX'];
      for (let i = 0; i < 18; i++) {
        const tradeId = 'T-20240814-' + String(1001 + i);
        const reportDate = '2024-08-' + String(10 + Math.floor(i / 3)).padStart(2, '0');
        const generatedAt = '2024-08-14 10:23:0' + (i % 10) + '.000';
        const failRate = i === 0 ? 0 : (i === 2 ? 0.85 : 0.18);
        const platform = platforms[i % platforms.length];
        const product = products[i % products.length];
        const channels = CHANNELS.map(ch => buildChannelData(ch, tradeId, reportDate, rng, failRate, platform, product));
        items.push({
          tradeId: tradeId,
          reportDate: reportDate,
          generatedAt: generatedAt,
          platform: platform,
          product: product,
          channels: channels,
          enabledChannels: (i % 3 === 0) ? ['HKTR', 'JSFA', 'CFTC'] : (i % 3 === 1 ? ['HKTR', 'JSFA'] : ['HKTR', 'CFTC']),
          skippedItems: buildSkippedItems(reportDate, rng),
          overviewLogs: buildOverviewLogs(tradeId, reportDate, channels),
        });
      }
      return items;
    }

    /* ---------- 应用状态与渲染 ---------- */
    const DATA = { items: buildDataset() };
    const COLUMNS = [
      { key: 'channel', label: '报告渠道', sortable: true,  filterable: 'select' },
      { key: 'source',  label: '来源渠道', sortable: true,  filterable: 'select' },
      { key: 'f',       label: '字段',     sortable: true,  filterable: 'text' },
      { key: 'x',       label: 'XPath',    sortable: true,  filterable: 'text' },
      { key: 't',       label: '类型',     sortable: true,  filterable: 'select' },
      { key: 'ctx',     label: '命中Ctx', sortable: true,  filterable: 'text' },
      { key: 'eo',      label: '期望值 (EO)', sortable: false, filterable: 'text' },
      { key: 'ao',      label: '实际值 (AO)', sortable: false, filterable: 'text' },
      { key: 'result',  label: '结果',     sortable: true,  filterable: 'select' },
      { key: 'note',    label: '说明',     sortable: true,  filterable: 'text' },
    ];
    const DEFAULT_COLUMNS = { channel: true, source: true, f: true, x: false, t: false, ctx: true, eo: true, ao: true, result: true, note: false };

    const state = {
      itemId: DATA.items[0].tradeId,
      tab: 'fields',
      channel: 'ALL',
      search: '',
      colFilter: { channel: 'ALL', source: 'ALL', f: '', x: '', t: 'ALL', ctx: '', eo: '', ao: '', result: 'ALL', note: '' },
      sort: { key: '', dir: 1 },
      page: 1,
      pageSize: 20,
      columns: Object.assign({}, DEFAULT_COLUMNS),
      itemSearch: '',
      itemFilter: 'ALL',
      itemPlatforms: [],
      itemProducts: [],
      sidebarPage: 1,
      sidebarPageSize: 8,
      specialFilter: { eo: 'ALL', ao: 'ALL' },
      msgSort: { key: '', dir: 1 },
      msgFilter: {},
      reportDateFilter: (function () { const ds = DATA.items.map(function (i) { return i.reportDate; }).sort(); return ds.length ? ds[ds.length - 1] : ''; })(),
    };
    let ACTIVE_FILTERS = [];
    let SIDEBAR_FILTERS = [];
    let POPOVER = { el: null, cleanup: null };

    /* ---------- 警告忽略配置（动态存储，后续可改为 JSON 字段加载） ---------- */
    const IGNORE_STORAGE_KEY = 'deepseekValidationIgnoreConfig.v1';
    let IGNORE_CONFIG = {};
    (function loadIgnoreConfig() {
      try { IGNORE_CONFIG = JSON.parse(localStorage.getItem(IGNORE_STORAGE_KEY) || '{}'); }
      catch (e) { IGNORE_CONFIG = {}; }
    })();

    function msgIgnoreKey(tab, m) {
      if (tab === 'warnings') return JSON.stringify(['warn', m.channel, m.field || '', m.type, m.level, m.platform || '', m.product || '']);
      if (tab === 'uncompared') return JSON.stringify(['xpath', m.xpath, m.channel, m.platform || '', m.product || '', m.ctx || '']);
      return null;
    }
    function msgIsIgnored(tab, m) {
      const k = msgIgnoreKey(tab, m);
      return k ? !!IGNORE_CONFIG[k] : false;
    }
    function saveIgnoreConfig() {
      try { localStorage.setItem(IGNORE_STORAGE_KEY, JSON.stringify(IGNORE_CONFIG)); } catch (e) {}
    }
    function toggleIgnoreByKey(key) {
      if (IGNORE_CONFIG[key]) delete IGNORE_CONFIG[key];
      else IGNORE_CONFIG[key] = true;
      saveIgnoreConfig();
      renderSummary(); renderTabs(); renderChannelTabs();
      renderSidebar(); renderSidebarChips(); renderContent();
    }
    function exportIgnoreConfig() {
      const grouped = {};
      Object.keys(IGNORE_CONFIG).forEach(function (k) {
        if (!IGNORE_CONFIG[k]) return;
        let arr;
        try { arr = JSON.parse(k); } catch (e) { return; }
        let platform, entry;
        if (arr[0] === 'warn') {
          platform = arr[5] || 'UNKNOWN';
          entry = { kind: 'warning', channel: arr[1], field: arr[2], type: arr[3], level: arr[4], product: arr[6] };
        } else if (arr[0] === 'xpath') {
          platform = arr[3] || 'UNKNOWN';
          entry = { kind: 'uncomparedXpath', xpath: arr[1], channel: arr[2], product: arr[4], ctx: arr[5] };
        } else return;
        if (!grouped[platform]) grouped[platform] = { warnings: [], uncomparedXpaths: [] };
        if (entry.kind === 'warning') grouped[platform].warnings.push(entry);
        else grouped[platform].uncomparedXpaths.push(entry);
      });
      const blob = new Blob([JSON.stringify(grouped, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'ignore-config-by-platform.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function currentItem() {
      return DATA.items.find(it => it.tradeId === state.itemId) || DATA.items[0];
    }

    function highlight(text, q) {
      const s = esc(text);
      const query = (q || '').trim();
      if (!query) return s;
      const lower = text.toLowerCase();
      const ql = query.toLowerCase();
      let out = '';
      let i = 0;
      while (i < text.length) {
        const idx = lower.indexOf(ql, i);
        if (idx === -1) { out += esc(text.slice(i)); break; }
        out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx + ql.length)) + '</mark>';
        i = idx + ql.length;
      }
      return out;
    }

    function scopeChannels() {
      const it = currentItem();
      if (state.channel === 'ALL') return it.channels.filter(function (c) { return it.enabledChannels.indexOf(c.name) !== -1; });
      if (it.enabledChannels.indexOf(state.channel) === -1) return [];
      return it.channels.filter(function (c) { return c.name === state.channel; });
    }

    function flatFields(item) {
      const rows = [];
      item.channels.forEach(ch => {
        ch.sources.forEach(s => {
          s.fields.forEach(f => rows.push({
            channel: ch.name, source: s.name,
            id: f.id, f: f.f, x: f.x, t: f.t, ctx: f.ctx,
            eo: f.eo, ao: f.ao, result: f.result, note: f.note, prints: f.prints,
          }));
        });
      });
      return rows;
    }

    function itemStatsAll(item) {
      let total = 0, passed = 0, failed = 0;
      item.channels.forEach(ch => ch.sources.forEach(s => s.fields.forEach(f => {
        total++;
        f.result === 'PASSED' ? passed++ : failed++;
      })));
      let warnings = 0, warningsIgnored = 0;
      item.channels.forEach(c => c.warnings.forEach(w => { if (msgIsIgnored('warnings', w)) warningsIgnored++; else warnings++; }));
      const errors = item.channels.reduce((n, c) => n + c.errors.length, 0);
      const uncompared = item.channels.reduce((n, c) => n + c.uncompared.length, 0);
      const logs = item.overviewLogs.length + item.channels.reduce((n, c) => n + c.logs.length, 0);
      return { total: total, passed: passed, failed: failed, rate: total ? Math.round(passed / total * 100) : 0, warnings: warnings, warningsIgnored: warningsIgnored, errors: errors, uncompared: uncompared, logs: logs };
    }

    function scopeWarnings() { const a = []; scopeChannels().forEach(c => c.warnings.forEach(w => a.push(w))); return a; }
    function scopeErrors() { const a = []; scopeChannels().forEach(c => c.errors.forEach(w => a.push(w))); return a; }
    function scopeUncompared() { const a = []; scopeChannels().forEach(c => c.uncompared.forEach(w => a.push(w))); return a; }
    function scopeSkippedItems() {
      const it = currentItem();
      if (state.channel === 'ALL') return it.skippedItems;
      if (it.enabledChannels.indexOf(state.channel) === -1) return [];
      return it.skippedItems.filter(s => s.channel === 'ALL' || s.channel === state.channel);
    }
    function scopeLogs() {
      const it = currentItem();
      if (state.channel === 'ALL') {
        const lines = it.overviewLogs.slice();
        it.channels.forEach(c => c.logs.forEach(l => lines.push(l)));
        return lines;
      }
      const c = it.channels.find(c => c.name === state.channel);
      return c ? c.logs.slice() : [];
    }

    function scopeStats() {
      let total = 0, passed = 0, failed = 0;
      scopeChannels().forEach(ch => ch.sources.forEach(s => s.fields.forEach(f => {
        total++;
        f.result === 'PASSED' ? passed++ : failed++;
      })));
      return {
        total: total, passed: passed, failed: failed,
        rate: total ? Math.round(passed / total * 100) : 0,
        warnings: scopeWarnings().filter(m => !msgIsIgnored('warnings', m)).length,
        warningsIgnored: scopeWarnings().filter(m => msgIsIgnored('warnings', m)).length,
        errors: scopeErrors().length,
        uncompared: scopeUncompared().filter(u => !msgIsIgnored('uncompared', u)).length,
        uncomparedIgnored: scopeUncompared().filter(u => msgIsIgnored('uncompared', u)).length,
        logs: scopeLogs().length,
        skipped: scopeSkippedItems().length,
      };
    }

    function sortValue(r, key) {
      switch (key) {
        case 'f': return r.f;
        case 'x': return r.x;
        case 't': return r.t;
        case 'result': return r.result;
        case 'ctx': return (r.ctx || []).join(',');
        case 'eo': return r.eo;
        case 'ao': return r.ao;
        case 'channel': return r.channel;
        case 'source': return r.source;
        case 'note': return r.note;
        default: return '';
      }
    }

    function specialValueMatch(v, kind) {
      const s = String(v);
      if (kind === 'empty') return s === '';
      if (kind === 'blank') return /^\s+$/.test(s);
      if (kind === 'special') return /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u200B\u200C\u200D\uFEFF]/.test(s);
      return true;
    }

    function filteredFields(item) {
      let rows = flatFields(item);
      if (state.channel !== 'ALL') rows = rows.filter(r => r.channel === state.channel);
      COLUMNS.forEach(c => {
        const v = state.colFilter[c.key];
        if (!v || v === 'ALL') return;
        if (c.filterable === 'select') {
          rows = rows.filter(r => sortValue(r, c.key) === v);
        } else if (c.filterable === 'text') {
          rows = rows.filter(r => String(sortValue(r, c.key)).toLowerCase().includes(v.toLowerCase()));
        }
      });
      ['eo', 'ao'].forEach(function (col) {
        const sv = state.specialFilter[col];
        if (sv && sv !== 'ALL') rows = rows.filter(function (r) { return specialValueMatch(sortValue(r, col), sv); });
      });
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        rows = rows.filter(r => (r.f + ' ' + r.x + ' ' + r.eo + ' ' + r.ao + ' ' + (r.ctx || []).join(' ')).toLowerCase().includes(q));
      }
      if (state.sort.key) {
        const k = state.sort.key, d = state.sort.dir;
        rows.sort((a, b) => { const va = sortValue(a, k), vb = sortValue(b, k); if (va < vb) return -1 * d; if (va > vb) return 1 * d; return 0; });
      }
      return rows;
    }

    function preview(v) {
      const s = String(v).replace(/\r?\n/g, ' ⏎ ');
      return s.length > 32 ? s.slice(0, 32) + '…' : s;
    }

    function typeChip(t) {
      const m = TYPE_META[t] || { label: t, cls: '' };
      return '<span class="chip ' + m.cls + '">' + esc(m.label) + '</span>';
    }

    function sortArrow(key) {
      if (state.sort.key !== key) return '⇅';
      return state.sort.dir === 1 ? '▲' : '▼';
    }

    function findFieldById(item, id) {
      for (const ch of item.channels) {
        for (const s of ch.sources) {
          for (const f of s.fields) if (f.id === id) return { channel: ch.name, source: s.name, field: f };
        }
      }
      return null;
    }

    /* ---- 渲染 ---- */
    function filteredItems() {
      const q = state.itemSearch.trim().toLowerCase();
      const tokens = q ? q.split(/\s+/).filter(Boolean) : [];
      const list = DATA.items.filter(it => {
        const s = itemStatsAll(it);
        const hay = (it.tradeId + ' ' + it.reportDate + ' ' + it.platform + ' ' + it.product).toLowerCase();
        if (tokens.length && !tokens.every(t => hay.includes(t))) return false;
        if (state.reportDateFilter && it.reportDate !== state.reportDateFilter) return false;
        if (state.itemFilter === 'PASSED' && s.failed !== 0) return false;
        if (state.itemFilter === 'FAILED' && s.failed === 0) return false;
        if (state.itemFilter === 'WARN' && s.warnings === 0) return false;
        if (state.itemPlatforms.length && state.itemPlatforms.indexOf(it.platform) === -1) return false;
        if (state.itemProducts.length && state.itemProducts.indexOf(it.product) === -1) return false;
        return true;
      });
      list.sort(function (a, b) { return b.reportDate.localeCompare(a.reportDate); });
      return list;
    }

    function renderSidebar() {
      const all = filteredItems();
      const pages = Math.max(1, Math.ceil(all.length / state.sidebarPageSize));
      if (state.sidebarPage > pages) state.sidebarPage = pages;
      const start = (state.sidebarPage - 1) * state.sidebarPageSize;
      const list = all.slice(start, start + state.sidebarPageSize);
      const q = state.itemSearch.trim();
      const rows = list.map(it => {
        const s = itemStatsAll(it);
        const cls = it.tradeId === state.itemId ? 'item active' : 'item';
        const badgeCls = s.failed === 0 ? 'pass' : 'fail';
        const badgeText = s.failed === 0 ? 'PASS' : 'FAIL';
        const barCls = 'bar-fill' + (s.failed === 0 && s.warnings > 0 ? ' bar-warn' : '');
        const warnNote = s.warnings > 0 ? ' · ' + s.warnings + ' 未确认警告' : '';
        return '<div class="' + cls + '" data-id="' + it.tradeId + '">' +
          '<div class="item-id">' + highlight(it.tradeId, q) + ' <span class="badge ' + badgeCls + '">' + badgeText + '</span></div>' +
          '<div class="item-sub">' + s.total + ' 字段 · ' + s.failed + ' 失败 · ' + s.rate + '% 通过' + warnNote + '</div>' +
          '<div class="item-sub">报告日期 ' + esc(it.reportDate) + '</div>' +
          '<div class="item-sub">' + esc(it.platform) + ' · ' + esc(it.product) + '</div>' +
          '<div class="bar"><div class="' + barCls + '" style="width:' + s.rate + '%"></div></div>' +
          '</div>';
      }).join('');
      document.getElementById('sidebarList').innerHTML = rows || '<div class="empty">无匹配 item</div>';
      let passedItems = 0, failedItems = 0;
      all.forEach(function (it) { if (itemStatsAll(it).failed === 0) passedItems++; else failedItems++; });
      const pct = all.length ? Math.round(passedItems / all.length * 100) : 0;
      document.getElementById('itemCount').textContent = passedItems + '/' + failedItems + '/' + pct + '%';
      let pagerHtml = '';
      if (all.length > 0) {
        const p = state.sidebarPage;
        const from = Math.max(1, p - 1), to = Math.min(pages, p + 1);
        let parts = [
          '<button class="pg" data-sidepage="1"' + (p === 1 ? ' disabled' : '') + ' title="首页">«</button>',
          '<button class="pg" data-sidepage="' + (p - 1) + '"' + (p === 1 ? ' disabled' : '') + ' title="上一页">‹</button>'
        ];
        for (let i = from; i <= to; i++) parts.push('<button class="pg' + (i === p ? ' cur' : '') + '" data-sidepage="' + i + '">' + i + '</button>');
        parts.push(
          '<button class="pg" data-sidepage="' + (p + 1) + '"' + (p === pages ? ' disabled' : '') + ' title="下一页">›</button>',
          '<button class="pg" data-sidepage="' + pages + '"' + (p === pages ? ' disabled' : '') + ' title="尾页">»</button>'
        );
        pagerHtml = parts.join('') + '<span class="pg-info">' + p + '/' + pages + '</span>';
      }
      document.getElementById('sidebarPager').innerHTML = pagerHtml;
    }

    function renderSidebarChips() {
      const chips = [];
      if (state.itemFilter !== 'ALL') {
        chips.push({
          label: '状态: ' + (state.itemFilter === 'PASSED' ? '全部通过' : (state.itemFilter === 'WARN' ? '存在警告' : '存在失败')),
          clear: function () { state.itemFilter = 'ALL'; document.getElementById('itemFilter').value = 'ALL'; },
        });
      }
      state.itemPlatforms.forEach(function (v) {
        chips.push({
          label: '平台: ' + v,
          clear: function () { const i = state.itemPlatforms.indexOf(v); if (i !== -1) state.itemPlatforms.splice(i, 1); },
        });
      });
      state.itemProducts.forEach(function (v) {
        chips.push({
          label: '产品: ' + v,
          clear: function () { const i = state.itemProducts.indexOf(v); if (i !== -1) state.itemProducts.splice(i, 1); },
        });
      });
      SIDEBAR_FILTERS = chips;
      document.getElementById('sidebarChips').innerHTML = chips.map((c, i) =>
        '<span class="filter-chip">' + esc(c.label) + '<button data-sideclear="' + i + '" title="清除">✕</button></span>'
      ).join('');
      document.getElementById('platformFilterBtn').classList.toggle('has-filter', state.itemPlatforms.length > 0);
      document.getElementById('productFilterBtn').classList.toggle('has-filter', state.itemProducts.length > 0);
    }

    function renderSummary() {
      const s = scopeStats();
      const cards = [
        { label: '字段总数', value: s.total, cls: '', action: 'fields', active: state.tab === 'fields' && state.colFilter.result === 'ALL', tip: '该 item 在当前作用域（全部或指定报告渠道）下参与比较的字段总数。' },
        { label: '通过', value: s.passed, cls: 'ok', action: 'passed', active: state.tab === 'fields' && state.colFilter.result === 'PASSED', tip: '比较结果为 PASSED 的字段数量。' },
        { label: '失败', value: s.failed, cls: 'bad', action: 'failed', active: state.tab === 'fields' && state.colFilter.result === 'FAILED', tip: '比较结果为 FAILED 的字段数量。' },
        { label: '通过率', value: s.rate + '%', cls: '', action: null, active: false, tip: 'PASSED 字段占字段总数的百分比。' },
        { label: '警告', value: s.warnings + '/<span class="num-muted">' + s.warningsIgnored + '</span>', cls: 'warn', action: 'warnings', active: state.tab === 'warnings', tip: '比较过程中识别的警告信息数量（未忽略/已忽略）。' },
        { label: '错误', value: s.errors, cls: 'bad', action: 'errors', active: state.tab === 'errors', tip: '比较过程中识别的错误信息数量。' },
      ];
      document.getElementById('summary').innerHTML = cards.map(c => {
        const cls = 'card' + (c.action ? ' clickable' : '') + (c.active ? ' active-filter' : '');
        const attr = (c.action ? ' data-action="' + c.action + '"' : '') + (c.tip ? ' title="' + esc(c.tip) + '"' : '');
        return '<div class="' + cls + '"' + attr + '>' +
          '<div class="card-label">' + c.label + '</div>' +
          '<div class="card-value ' + c.cls + '">' + c.value + '</div></div>';
      }).join('');
    }

    function renderMeta() {
      const it = currentItem();
      document.getElementById('itemMeta').textContent = it.tradeId;
      document.getElementById('reportMeta').textContent = '报告日期：' + it.reportDate + '　　生成时间：' + it.generatedAt;
      document.getElementById('channelMeta').textContent = '报告渠道：' +
        it.channels.map(c => c.name + '（' + c.desc + '）').join('　');
    }

    function renderFiles() {
      const it = currentItem();
      const chs = state.channel === 'ALL' ? it.channels : it.channels.filter(c => c.name === state.channel);
      const html = chs.map(ch =>
        '<div class="file-card">' +
        '<div class="fc-head">' + esc(ch.name) + '</div>' +
        '<div class="fc-row"><span class="fc-label">EO (CSV): </span>' + ch.files.eo.map(esc).join('、') + '</div>' +
        '<div class="fc-row"><span class="fc-label">AO (XML): </span>' + ch.files.ao.map(esc).join('、') + '</div>' +
        '<div class="fc-row"><span class="fc-label">Excel: </span>' + esc(ch.files.excel.file) + ' [sheet: ' + esc(ch.files.excel.sheet) + ']</div>' +
        '</div>'
      ).join('');
      document.getElementById('filesPanel').innerHTML =
        '<div class="files-title">输入 / 配置文件（EO=来源 CSV，AO=报送 XML，Excel=映射配置）</div>' +
        '<div class="files-grid">' + html + '</div>';
    }

    function renderTaskNote() {
      document.getElementById('taskNote').innerHTML =
        '<div class="task-note-title">任务说明</div>' +
        '<div class="task-note-text">' + esc(TASK_NOTE).replace(/\n/g, '<br>') + '</div>';
    }

    function renderTabs() {
      const s = scopeStats();
      const tabs = [
        ['fields', '字段比较', s.total, null],
        ['warnings', '警告', s.warnings + '/' + s.warningsIgnored, null],
        ['errors', '错误', s.errors, null],
        ['uncompared', '未比较 XPath', s.uncompared + '/' + s.uncomparedIgnored, '未在映射配置中匹配到 CSV 字段、因而未参与比较的 XPath。'],
        ['uncomparedItems', '未比较 Item', s.skipped, '属于该报告日期但未能参与比较的 item id 及其原因。'],
        ['logs', '完整日志', s.logs, null],
      ];
      document.getElementById('tabs').innerHTML = tabs.map(function (t) {
        const cls = state.tab === t[0] ? 'tab active' : 'tab';
        return '<button class="' + cls + '" data-tab="' + t[0] + '"' + (t[3] ? ' title="' + esc(t[3]) + '"' : '') + '>' + t[1] +
          '<span class="tab-count">' + t[2] + '</span></button>';
      }).join('');
    }

    function channelCount(chName, tab) {
      const it = currentItem();
      if (chName === 'ALL') {
        if (tab === 'fields') return flatFields(it).length;
        if (tab === 'warnings') return it.channels.reduce((n, c) => n + c.warnings.filter(w => !msgIsIgnored('warnings', w)).length, 0);
        if (tab === 'errors') return it.channels.reduce((n, c) => n + c.errors.length, 0);
        if (tab === 'uncompared') return it.channels.reduce((n, c) => n + c.uncompared.filter(u => !msgIsIgnored('uncompared', u)).length, 0);
        if (tab === 'uncomparedItems') return it.skippedItems.length;
        if (tab === 'logs') return it.overviewLogs.length + it.channels.reduce((n, c) => n + c.logs.length, 0);
      }
      const ch = it.channels.find(c => c.name === chName);
      if (!ch) return 0;
      if (tab === 'fields') return flatFields(it).filter(r => r.channel === chName).length;
      if (tab === 'warnings') return ch.warnings.filter(w => !msgIsIgnored('warnings', w)).length;
      if (tab === 'errors') return ch.errors.length;
      if (tab === 'uncompared') return ch.uncompared.filter(u => !msgIsIgnored('uncompared', u)).length;
      if (tab === 'uncomparedItems') return it.skippedItems.filter(s => s.channel === chName).length;
      if (tab === 'logs') return ch.logs.length;
      return 0;
    }

    function renderChannelTabs() {
      const it = currentItem();
      const chs = [['ALL', '全部']].concat(it.channels.map(ch => [ch.name, ch.name]));
      const html = chs.map(([k, label]) => {
        const disabled = k !== 'ALL' && it.enabledChannels.indexOf(k) === -1;
        const cls = 'ctab' + (state.channel === k ? ' active' : '') + (disabled ? ' disabled' : '');
        const count = disabled ? '—' : channelCount(k, state.tab);
        return '<button class="' + cls + '" data-channel="' + k + '" title="' + (disabled ? '该渠道未启用' : '') + '">' + esc(label) +
          '<span class="ctab-count">' + count + '</span></button>';
      }).join('');
      const colBtn = state.tab === 'fields' ? '<button class="col-toggle" id="colToggle">列选择 ▾</button>' : '';
      document.getElementById('channelTabs').innerHTML = html + colBtn;
    }

    function activeFilters() {
      const list = [];
      if (state.channel !== 'ALL') list.push({ label: '渠道: ' + state.channel, clear: function () { state.channel = 'ALL'; } });
      if (state.search.trim()) list.push({ label: '搜索: ' + state.search.trim(), clear: function () { state.search = ''; document.getElementById('search').value = ''; } });
      if (state.tab === 'fields') {
        COLUMNS.forEach(function (c) {
          const v = state.colFilter[c.key];
          if (v && v !== 'ALL') {
            list.push({
              label: c.label + ': ' + v,
              clear: (function (key) {
                return function () {
                  const def = COLUMNS.find(function (x) { return x.key === key; });
                  state.colFilter[key] = def.filterable === 'select' ? 'ALL' : '';
                };
              })(c.key),
            });
          }
        });
        ['eo', 'ao'].forEach(function (col) {
          const sv = state.specialFilter[col];
          if (sv && sv !== 'ALL') {
            const label = col === 'eo' ? '期望值' : '实际值';
            const map = { empty: '空值', blank: '空白', special: '含特殊字符' };
            list.push({ label: label + '(' + (map[sv] || sv) + ')', clear: function () { state.specialFilter[col] = 'ALL'; } });
          }
        });
      } else if (MSG_COLUMNS[state.tab]) {
        MSG_COLUMNS[state.tab].forEach(function (c) {
          const v = state.msgFilter[c.key];
          if (v && v !== 'ALL') {
            list.push({
              label: c.label + ': ' + v,
              clear: (function (key) {
                return function () { state.msgFilter[key] = c.filter === 'select' ? 'ALL' : ''; };
              })(c.key),
            });
          }
        });
      }
      return list;
    }

    function renderFilterChips() {
      ACTIVE_FILTERS = activeFilters();
      const html = ACTIVE_FILTERS.map((f, i) =>
        '<span class="filter-chip">' + esc(f.label) +
        '<button data-clear="' + i + '" title="清除此过滤">✕</button></span>'
      ).join('');
      document.getElementById('filterChips').innerHTML = html;
    }

    function renderPagination(total, pages) {
      if (total === 0) return '';
      const p = state.page;
      const from = Math.max(1, p - 2), to = Math.min(pages, p + 2);
      let parts = [
        '<button class="pg" data-page="1"' + (p === 1 ? ' disabled' : '') + ' title="首页">«</button>',
        '<button class="pg" data-page="' + (p - 1) + '"' + (p === 1 ? ' disabled' : '') + ' title="上一页">‹</button>'
      ];
      for (let i = from; i <= to; i++) {
        parts.push('<button class="pg' + (i === p ? ' cur' : '') + '" data-page="' + i + '">' + i + '</button>');
      }
      parts.push(
        '<button class="pg" data-page="' + (p + 1) + '"' + (p === pages ? ' disabled' : '') + ' title="下一页">›</button>',
        '<button class="pg" data-page="' + pages + '"' + (p === pages ? ' disabled' : '') + ' title="尾页">»</button>'
      );
      return '<div class="pagination">' + parts.join('') +
        '<span class="pg-info">第 ' + p + ' / ' + pages + ' 页</span>' +
        '<select id="pageSize">' +
        [10, 20, 50].map(n => '<option' + (state.pageSize === n ? ' selected' : '') + '>' + n + '</option>').join('') +
        '</select></div>';
    }

    /* ---- 浮层（popover）管理 ---- */
    function closePopover() {
      if (POPOVER.el) { POPOVER.el.remove(); POPOVER.el = null; }
      if (POPOVER.cleanup) { POPOVER.cleanup(); POPOVER.cleanup = null; }
      document.querySelectorAll('.hf-toggle.active, .col-toggle.active, .side-multi.active').forEach(b => b.classList.remove('active'));
    }

    function openPopover(anchor, contentHTML, title) {
      closePopover();
      const pop = document.createElement('div');
      pop.className = 'popover';
      pop.innerHTML = (title ? '<p class="popover-title">' + esc(title) + '</p>' : '') + contentHTML;
      document.body.appendChild(pop);
      const r = anchor.getBoundingClientRect();
      const w = Math.min(260, window.innerWidth - 16);
      pop.style.width = w + 'px';
      pop.style.top = (r.bottom + 6) + 'px';
      pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
      anchor.classList.add('active');
      POPOVER.el = pop;
      const docClick = function (e) {
        if (!pop.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) closePopover();
      };
      document.addEventListener('click', docClick);
      POPOVER.cleanup = function () { document.removeEventListener('click', docClick); };
      return pop;
    }

    function selectOptionsFor(col) {
      if (col === 't' || col === 'type') return ['ALL', 'platformAssertion', 'productAssertion', 'contextAssertion'];
      if (col === 'result') return ['ALL', 'PASSED', 'FAILED'];
      if (col === 'channel') return ['ALL', 'HKTR', 'JSFA', 'CFTC'];
      if (col === 'source') return ['ALL', '来源渠道 A', '来源渠道 B'];
      if (col === 'level') return ['ALL', 'WARN', 'INFO', 'NOTICE', 'DEBUG', 'ERROR', 'FATAL', 'SEVERE'];
      return ['ALL'];
    }

    function openFilterPopover(btn, filterObj, col, kind, placeholder, onApply) {
      if (btn.classList.contains('active')) { closePopover(); return; }
      let control;
      if (kind === 'select') {
        const opts = selectOptionsFor(col);
        control = '<select class="pop-control">' +
          opts.map(o => '<option value="' + o + '"' + (filterObj[col] === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>';
      } else {
        control = '<input class="pop-control" placeholder="' + esc(placeholder || '搜索') + '" value="' + esc(filterObj[col] || '') + '">';
      }
      const pop = openPopover(btn, control);
      const ctrl = pop.querySelector('.pop-control');
      if (ctrl.tagName === 'INPUT') ctrl.focus();
      ctrl.addEventListener(kind === 'select' ? 'change' : 'input', function () {
        filterObj[col] = ctrl.value;
        state.page = 1;
        if (onApply) onApply();
        if (kind === 'select') closePopover();
      });
    }

    function openHfPopover(btn) {
      const col = btn.getAttribute('data-hf');
      const kind = btn.getAttribute('data-kind');
      const def = COLUMNS.find(function (c) { return c.key === col; });
      openFilterPopover(btn, state.colFilter, col, kind, def ? '过滤 ' + def.label : '搜索', function () { refreshFieldsBody(); renderFilterChips(); });
    }

    function openMsgFilterPopover(btn) {
      const col = btn.getAttribute('data-hf');
      const kind = btn.getAttribute('data-kind');
      openFilterPopover(btn, state.msgFilter, col, kind, btn.getAttribute('data-title') || '搜索', function () { renderContent(); renderFilterChips(); });
    }

    function openSpecialPopover(btn) {
      const col = btn.getAttribute('data-special');
      const opts = [['ALL', '全部'], ['empty', '空值'], ['blank', '空白'], ['special', '含特殊字符']];
      const control = '<select class="pop-control">' +
        opts.map(function (o) { return '<option value="' + o[0] + '"' + (state.specialFilter[col] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
      const pop = openPopover(btn, control);
      pop.querySelector('.pop-control').addEventListener('change', function (e) {
        state.specialFilter[col] = e.target.value;
        state.page = 1;
        refreshFieldsBody(); renderFilterChips();
        closePopover();
      });
    }

    function openColumnMenu(anchor) {
      if (anchor.classList.contains('active')) { closePopover(); return; }
      const buildContent = function () {
        const allChecked = COLUMNS.every(function (c) { return state.columns[c.key]; });
        let html = '<label class="col-option"><input type="checkbox" data-colkey="__ALL__"' + (allChecked ? ' checked' : '') + '> 全部</label>';
        COLUMNS.forEach(function (c) {
          html += '<label class="col-option"><input type="checkbox" data-colkey="' + c.key + '"' + (state.columns[c.key] ? ' checked' : '') + '> ' + c.label + '</label>';
        });
        return html;
      };
      const pop = openPopover(anchor, buildContent(), '选择要显示的列');
      const bind = function () {
        pop.querySelectorAll('input[data-colkey]').forEach(function (cb) {
          cb.addEventListener('change', function () {
            const key = cb.getAttribute('data-colkey');
            if (key === '__ALL__') COLUMNS.forEach(function (c) { state.columns[c.key] = cb.checked; });
            else state.columns[key] = cb.checked;
            renderFields();
            pop.innerHTML = buildContent();
            bind();
          });
        });
      };
      bind();
    }

    function distinctValues(prop) {
      const s = [];
      DATA.items.forEach(it => { if (s.indexOf(it[prop]) === -1) s.push(it[prop]); });
      return s;
    }

    function openSideMulti(btn) {
      if (btn.classList.contains('active')) { closePopover(); return; }
      const field = btn.getAttribute('data-field');
      const prop = field === 'itemPlatforms' ? 'platform' : 'product';
      const title = field === 'itemPlatforms' ? '平台' : '产品';
      const vals = distinctValues(prop);
      const buildContent = function () {
        const allChecked = state[field].length === 0;
        let html = '<label class="col-option"><input type="checkbox" data-val="__ALL__"' + (allChecked ? ' checked' : '') + '> 全部</label>';
        vals.forEach(v => {
          html += '<label class="col-option"><input type="checkbox" data-val="' + esc(v) + '"' + (state[field].indexOf(v) !== -1 ? ' checked' : '') + '> ' + esc(v) + '</label>';
        });
        return html;
      };
      const pop = openPopover(btn, buildContent(), '选择' + title);
      const bind = function () {
        pop.querySelectorAll('input[data-val]').forEach(cb => {
          cb.addEventListener('change', function () {
            const v = cb.getAttribute('data-val');
            if (v === '__ALL__') {
              state[field] = [];
            } else {
              const arr = state[field];
              const idx = arr.indexOf(v);
              if (cb.checked && idx === -1) arr.push(v);
              else if (!cb.checked && idx !== -1) arr.splice(idx, 1);
            }
            state.sidebarPage = 1;
            renderSidebar();
            renderSidebarChips();
            pop.innerHTML = buildContent();
            bind();
          });
        });
      };
      bind();
    }

    /* ---- 字段比较列表 ---- */
    function valueCellHTML(v) {
      const s = String(v);
      const long = s.length > 32 || /\r?\n/.test(s);
      if (!long) return '<span class="val-full">' + esc(s) + '</span>';
      return '<details class="val-details"><summary>' + esc(preview(s)) + '</summary><pre>' + esc(s) + '</pre></details>';
    }

    function textCellHTML(v) {
      const s = String(v);
      const long = s.length > 40 || /\r?\n/.test(s);
      if (!long) return '<span class="text-full">' + esc(s) + '</span>';
      return '<details class="text-details"><summary>' + esc(preview(s)) + '</summary><pre>' + esc(s) + '</pre></details>';
    }

    function hoverCellHTML(v) {
      const s = String(v);
      const long = s.length > 40 || /\r?\n/.test(s);
      if (!long) return '<span class="text-full">' + esc(s) + '</span>';
      return '<span class="hover-trunc" title="' + esc(s) + '">' + esc(preview(s)) + '</span>';
    }

    function fieldCellHTML(r, key) {
      switch (key) {
        case 'channel': return '<td><span class="chip channel-chip">' + esc(r.channel) + '</span></td>';
        case 'source': return '<td>' + esc(r.source) + '</td>';
        case 'f': return '<td class="mono"><a class="val-link" data-detail="' + esc(r.id) + '" title="查看比较详情">' + esc(r.f) + '</a></td>';
        case 'x': return '<td>' + valueCellHTML(r.x) + '</td>';
        case 't': return '<td>' + typeChip(r.t) + '</td>';
        case 'ctx': return '<td><div class="ctx-tags">' + (r.ctx || []).map(function (c) { return '<span class="chip ctx-chip">' + esc(c) + '</span>'; }).join('') + '</div></td>';
        case 'eo': return '<td>' + valueCellHTML(r.eo) + '</td>';
        case 'ao': return '<td>' + valueCellHTML(r.ao) + '</td>';
        case 'result': {
          const pass = r.result === 'PASSED';
          return '<td><span class="badge ' + (pass ? 'pass' : 'fail') + '">' + r.result + '</span></td>';
        }
        case 'note': return '<td>' + hoverCellHTML(r.note || '—') + '</td>';
        default: return '<td></td>';
      }
    }

    function computeFieldPage() {
      const rows = filteredFields(currentItem());
      const total = rows.length;
      const pages = Math.max(1, Math.ceil(total / state.pageSize));
      if (state.page > pages) state.page = pages;
      const start = (state.page - 1) * state.pageSize;
      return { pageRows: rows.slice(start, start + state.pageSize), total: total, pages: pages };
    }

    function buildFieldRows(pageRows) {
      const visible = COLUMNS.filter(c => state.columns[c.key]);
      const trs = pageRows.map(r => {
        const pass = r.result === 'PASSED';
        return '<tr class="' + (pass ? '' : 'row-fail') + '">' +
          visible.map(c => fieldCellHTML(r, c.key)).join('') + '</tr>';
      }).join('');
      return trs || '<tr><td colspan="' + visible.length + '" class="empty">无匹配记录</td></tr>';
    }

    function fieldsHeaderHTML() {
      const cells = COLUMNS.filter(c => state.columns[c.key]).map(c => {
        const sort = c.sortable ? ' class="sortable" data-sort="' + c.key + '"' : '';
        let btn = '';
        if (c.filterable) {
          btn = '<button class="hf-toggle" data-hf="' + c.key + '" data-kind="' + c.filterable + '" title="过滤">⚲</button>';
        }
        let specialBtn = '';
        if (c.key === 'eo' || c.key === 'ao') {
          specialBtn = '<button class="special-toggle" data-special="' + c.key + '" title="空值/空白/含特殊字符过滤">∅</button>';
        }
        return '<th' + sort + '>' + c.label +
