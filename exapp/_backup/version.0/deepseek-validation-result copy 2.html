<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融监管报告比较 · 结果展示</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --pass: #16a34a;
      --pass-bg: #dcfce7;
      --fail: #dc2626;
      --fail-bg: #fee2e2;
      --warn: #d97706;
      --warn-bg: #fef3c7;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* 顶栏 */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }
    .topbar h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .topbar .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .page { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }

    /* 统计卡片 */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .card-label { color: var(--muted); font-size: 12px; }
    .card-value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .card-value.ok { color: var(--pass); }
    .card-value.bad { color: var(--fail); }
    .card-value.warn { color: var(--warn); }

    /* 工具栏 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .toolbar input[type="search"] {
      flex: 1 1 240px;
      min-width: 180px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .toolbar input[type="search"]:focus { border-color: var(--accent); }
    .toolbar select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .toolbar select:disabled { opacity: .45; cursor: not-allowed; }

    /* 主体布局 */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* 侧栏 item 列表 */
    .sidebar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .sidebar-head {
      padding: 12px 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-head .count {
      background: #eef2ff;
      color: #4338ca;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
    }
    .item { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #f9fafb; }
    .item.active { background: #eff6ff; box-shadow: inset 3px 0 0 var(--accent); }
    .item-id { font-weight: 600; font-family: var(--mono); }
    .item-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bar { height: 6px; background: #eef0f3; border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--pass); border-radius: 999px; }

    /* 详情区 */
    .detail {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .detail-head { padding: 16px 18px 0; }
    .detail-head h2 { margin: 0; font-size: 18px; font-family: var(--mono); }
    .detail-head .channels { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .tab {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab:hover { border-color: var(--accent); color: var(--accent); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab-count {
      background: rgba(0,0,0,.08);
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
    }
    .tab.active .tab-count { background: rgba(255,255,255,.25); }

    .channel-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 18px 0;
    }
    .ctab {
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ctab:hover { border-color: var(--accent); color: var(--accent); }
    .ctab.active { background: #eef2ff; border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .ctab-count { color: var(--muted); font-size: 12px; }
    .ctab.active .ctab-count { color: var(--accent); }

    .content { padding: 16px 18px 20px; }

    /* 表格 */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: #f9fafb; color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    tr.row-fail td { background: #fffafa; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .xpath { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 28px !important; }

    /* 徽章与芯片 */
    .chip { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
    .channel-chip { background: #eef2ff; color: #4338ca; }
    .tp-platform { background: #e0f2fe; color: #0369a1; }
    .tp-product { background: #ede9fe; color: #6d28d9; }
    .tp-context { background: #fef3c7; color: #b45309; }
    .badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
    .badge.pass { background: var(--pass-bg); color: var(--pass); }
    .badge.fail { background: var(--fail-bg); color: var(--fail); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }

    /* 分页 */
    .pagination { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .pg {
      min-width: 30px; height: 30px;
      border: 1px solid var(--border);
      background: #fff; color: var(--text);
      border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .pg:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pg.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pg:disabled { opacity: .4; cursor: not-allowed; }
    .pg-info { color: var(--muted); font-size: 12px; margin: 0 6px; }
    .pagination select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; }

    /* 日志 */
    .log-box {
      background: #0f172a; color: #d1fae5;
      border-radius: 10px; padding: 14px 16px;
      font-family: var(--mono); font-size: 12px;
      max-height: 520px; overflow: auto;
    }
    .log-line { white-space: pre-wrap; word-break: break-all; }

    .meta-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .footer-note { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; }

    /* 过滤标识 chips */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filters:empty { display: none; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #eef2ff; color: #4338ca;
      border-radius: 999px; padding: 4px 10px; font-size: 12px;
    }
    .filter-chip button {
      border: none; background: none; color: #4338ca;
      cursor: pointer; font-size: 13px; line-height: 1; padding: 0;
    }
    .filter-chip button:hover { color: #1e3a8a; }

    /* 可点击统计卡片 */
    .card.clickable { cursor: pointer; transition: box-shadow .15s, border-color .15s, background .15s; }
    .card.clickable:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.12); }
    .card.active-filter { border-color: var(--accent); background: #eff6ff; }

    /* 元信息行 */
    .meta-line { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* 文件面板 */
    .files { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: #fafbfc; }
    .files-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .files-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .file-card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: #fff; min-width: 210px; flex: 1 1 210px; }
    .file-card .fc-head { font-weight: 600; font-size: 12px; color: #4338ca; margin-bottom: 4px; }
    .file-card .fc-row { font-size: 12px; color: var(--text); font-family: var(--mono); word-break: break-all; line-height: 1.6; }
    .file-card .fc-row .fc-label { color: var(--muted); font-family: inherit; }

    /* 表头排序 + 过滤输入 */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th .sort-arrow { font-size: 10px; margin-left: 2px; color: var(--accent); }
    th .hfilter {
      margin-top: 4px; width: 100%; padding: 4px 6px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; font-weight: 400; color: var(--text);
      background: #fff;
    }
    th .hfilter:focus { border-color: var(--accent); outline: none; }
    th select.hfilter { padding: 4px 2px; }

    /* 值预览 */
    .val {
      max-width: 200px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-family: var(--mono); font-size: 12px;
      display: inline-block; vertical-align: middle;
    }
    .val-link { color: var(--accent); cursor: pointer; text-decoration: none; }
    .val-link:hover { text-decoration: underline; }

    /* 详情弹窗 */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 20px;
    }
    .modal {
      background: #fff; border-radius: 12px; max-width: 880px; width: 100%;
      max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { margin: 0; font-size: 16px; }
    .modal-close { border: none; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px 18px; overflow: auto; }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; margin-bottom: 14px; font-size: 13px; }
    .kv .k { color: var(--muted); }
    .kv .v { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pair-box { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .pair-box .pb-head { background: #f9fafb; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
    .pair-box pre { margin: 0; padding: 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow: auto; }
    .print-box { margin-top: 14px; }
    .print-box .pb-head { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .print-box .print-line { font-family: var(--mono); font-size: 12px; color: #334155; white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>金融监管报告比较 · 结果展示</h1>
    <p class="sub">item (tradeId) → 报告渠道 (HKTR / JSFA / CFTC) → 来源渠道 → 字段级比较（EO 期望值 vs AO 实际值）</p>
  </header>

  <div class="page">
    <section class="summary" id="summary"></section>

    <div class="filters" id="filterChips"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="搜索 字段 / XPath / 期望值 / 实际值 / Ctx / 信息…">
    </div>

    <main class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <section class="detail">
        <div class="detail-head">
          <h2 id="itemMeta"></h2>
          <div class="meta-line" id="reportMeta"></div>
          <div class="channels" id="channelMeta"></div>
          <div class="files" id="filesPanel"></div>
          <div class="tabs" id="tabs"></div>
          <div class="channel-tabs" id="channelTabs"></div>
        </div>
        <div class="content" id="content"></div>
      </section>
    </main>

    <p class="footer-note">示例数据为内置生成器产出，可替换为真实比对结果 JSON。</p>
  </div>

  <script>
    /* ============================================================
     * 数据模型说明
     * item (tradeId) -> 报告渠道 (HKTR/JSFA/CFTC)
     *   -> 来源渠道 (A/B, 各有一套字段映射)
     *     -> 字段比较结果 { f, xpath, type, ctx, eo, ao, result, note, prints }
     * item 级别: reportDate / generatedAt / overviewLogs
     * 报告渠道级别: files / warnings[] / errors[] / uncompared[] / logs[]
     * ============================================================ */

    const TYPE_META = {
      platformAssertion: { label: '平台断言', cls: 'tp-platform' },
      productAssertion:  { label: '产品断言', cls: 'tp-product' },
      contextAssertion:  { label: '上下文断言', cls: 'tp-context' },
    };

    const CHANNELS = [
      { name: 'HKTR', desc: '香港交易资料储存库' },
      { name: 'JSFA', desc: '日本金融厅' },
      { name: 'CFTC', desc: '美国商品期货交易委员会' },
    ];

    // 每个报告渠道的字段定义: [字段, XPath, 断言类型, 值类型]
    const FIELD_DEFS = {
      HKTR: [
        ['tradeId',      '/HKTR/Rpt/Header/TradeId',     'contextAssertion', 'id'],
        ['reportId',     '/HKTR/Rpt/Header/RptId',       'contextAssertion', 'id'],
        ['product',      '/HKTR/Rpt/Product/Id',         'productAssertion',  'product'],
        ['notional',     '/HKTR/Rpt/Notional/Amt',       'productAssertion',  'num'],
        ['currency',     '/HKTR/Rpt/Notional/Ccy',       'productAssertion',  'code'],
        ['tradeDate',    '/HKTR/Rpt/Header/TradeDt',     'contextAssertion', 'date'],
        ['maturityDate', '/HKTR/Rpt/Header/MaturityDt',  'contextAssertion', 'date'],
        ['counterparty', '/HKTR/Rpt/Cpty/Name',          'contextAssertion', 'text'],
        ['platform',     '/HKTR/Rpt/Pltfrm/Id',          'platformAssertion', 'text'],
        ['venue',        '/HKTR/Rpt/Venu/Id',            'platformAssertion', 'text'],
        ['price',        '/HKTR/Rpt/Price/Amt',          'productAssertion',  'num'],
        ['quantity',     '/HKTR/Rpt/Qty/Amt',            'productAssertion',  'num'],
        ['remarks',      '/HKTR/Rpt/Header/Rmrk',        'contextAssertion', 'multi'],
      ],
      JSFA: [
        ['tradeId',        '/JSFA/Report/Header/TradeId',        'contextAssertion', 'id'],
        ['reportId',       '/JSFA/Report/Header/ReportId',       'contextAssertion', 'id'],
        ['product',        '/JSFA/Report/Product/ProductId',     'productAssertion',  'product'],
        ['notional',       '/JSFA/Report/Notional/Amount',       'productAssertion',  'num'],
        ['currency',       '/JSFA/Report/Notional/Currency',     'productAssertion',  'code'],
        ['tradeDate',      '/JSFA/Report/Header/TradeDate',      'contextAssertion', 'date'],
        ['settlementDate', '/JSFA/Report/Header/SettlementDate', 'contextAssertion', 'date'],
        ['counterparty',   '/JSFA/Report/Counterparty/Name',     'contextAssertion', 'text'],
        ['platform',       '/JSFA/Report/Execution/Platform',    'platformAssertion', 'text'],
        ['venue',          '/JSFA/Report/Execution/Venue',       'platformAssertion', 'text'],
        ['price',          '/JSFA/Report/Pricing/Price',         'productAssertion',  'num'],
        ['quantity',       '/JSFA/Report/Pricing/Quantity',      'productAssertion',  'num'],
        ['remarks',        '/JSFA/Report/Header/Remark',         'contextAssertion', 'multi'],
      ],
      CFTC: [
        ['tradeId',      '/CFTC/Data/Header/UniqueSwapId',    'contextAssertion', 'id'],
        ['reportId',     '/CFTC/Data/Header/ReportId',        'contextAssertion', 'id'],
        ['product',      '/CFTC/Data/Product/ProductId',      'productAssertion',  'product'],
        ['notional',     '/CFTC/Data/Notional/Amount',        'productAssertion',  'num'],
        ['currency',     '/CFTC/Data/Notional/Currency',      'productAssertion',  'code'],
        ['tradeDate',    '/CFTC/Data/Header/ExecutionTs',     'contextAssertion', 'date'],
        ['maturityDate', '/CFTC/Data/Header/ExpirationDate',  'contextAssertion', 'date'],
        ['counterparty', '/CFTC/Data/Counterparty/Name',      'contextAssertion', 'text'],
        ['platform',     '/CFTC/Data/Execution/Platform',     'platformAssertion', 'text'],
        ['venue',        '/CFTC/Data/Execution/Venue',        'platformAssertion', 'text'],
        ['price',        '/CFTC/Data/Pricing/Price',          'productAssertion',  'num'],
        ['quantity',     '/CFTC/Data/Pricing/Quantity',       'productAssertion',  'num'],
        ['remarks',      '/CFTC/Data/Header/Remark',          'contextAssertion', 'multi'],
      ],
    };

    /* ---------- 示例数据生成器（真实数据可替换此部分） ---------- */
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const MULTI_TEXT =
      '第一行备注：交易双方已确认条款，包含特殊字符 <PartyRole id="P1"> & "quote" & \'single\'。</PartyRole>\n' +
      '第二行备注：本字段可能包含较长内容，用于验证多行与特殊字符的展示效果。\n' +
      '第三行备注：配置驱动比较，命中上下文后取得字段对应关系。';

    function genValue(kind, rng) {
      if (kind === 'id') return 'TX-2024-' + String(100000 + Math.floor(rng() * 900000));
      if (kind === 'num') return (100000 + rng() * 9900000).toFixed(2);
      if (kind === 'date') {
        const d = new Date(Date.UTC(2024, 0, 1) + Math.floor(rng() * 364) * 86400000);
        return d.toISOString().slice(0, 10);
      }
      if (kind === 'code') return ['USD', 'CNY', 'HKD', 'JPY', 'EUR'][Math.floor(rng() * 5)];
      if (kind === 'product') return ['IRS', 'CDS', 'FXS', 'SWAP', 'FORWARD'][Math.floor(rng() * 5)];
      if (kind === 'text') return ['ABC Bank', 'Citi Group', 'HSBC', 'Nomura', 'Goldman Sachs'][Math.floor(rng() * 5)];
      if (kind === 'multi') return MULTI_TEXT;
      return 'VAL-' + Math.floor(rng() * 9999);
    }

    function mutateValue(v, kind, rng) {
      if (kind === 'num') {
        const n = parseFloat(v);
        const delta = (rng() < 0.5 ? -1 : 1) * (0.01 + Math.floor(rng() * 99));
        return (n + delta).toFixed(2);
      }
      if (kind === 'date') {
        const d = new Date(v);
        d.setUTCDate(d.getUTCDate() + 1 + Math.floor(rng() * 9));
        return d.toISOString().slice(0, 10);
      }
      if (kind === 'code') { const codes = ['USD', 'CNY', 'HKD', 'JPY', 'EUR']; return codes.find(c => c !== v) || 'GBP'; }
      if (kind === 'product') { const ps = ['IRS', 'CDS', 'FXS', 'SWAP', 'FORWARD']; return ps.find(p => p !== v) || 'OPTION'; }
      if (kind === 'id') return v.slice(0, -1) + String(Math.floor(rng() * 10));
      if (kind === 'multi') return v.replace('已确认条款', '存在差异条款') + '\n[差异] 新增差异行：内容不一致。';
      const texts = ['XYZ Bank', 'Deutsche Bank', 'Mizuho', 'BNP Paribas', 'Barclays'];
      return texts.find(t => t !== v) || 'Other Bank';
    }

    function noteFor(kind) {
      if (kind === 'num') return '数值差异';
      if (kind === 'date') return '日期差异';
      if (kind === 'code' || kind === 'product') return '码值差异';
      if (kind === 'multi') return '内容差异';
      return '值不一致';
    }

    const WARN_TEXTS = [
      '配置映射缺失：CSV 字段未找到对应 XPath，已跳过',
      '字段格式与映射配置不一致，使用默认校验规则',
      '日期格式异常，已自动规范化处理',
      '空值处理：期望值为空，按容错策略判定通过',
      '关键字段重复，仅保留首条记录',
    ];
    const ERR_TEXTS = [
      'XPath 解析失败：节点不存在',
      '类型转换异常：无法转换为数值',
      '映射配置错误：XPath 语法非法',
      '运行时异常：字段比较过程被中断',
      '日志缓冲达到上限，部分日志被丢弃',
    ];

    function buildMessages(level, rng, channelName, fieldsDef) {
      const count = 2 + Math.floor(rng() * 4);
      const pool = level === 'warning' ? WARN_TEXTS : ERR_TEXTS;
      const keys = Object.keys(TYPE_META);
      const msgs = [];
      for (let i = 0; i < count; i++) {
        msgs.push({
          channel: channelName,
          type: keys[Math.floor(rng() * keys.length)],
          level: level,
          text: pool[Math.floor(rng() * pool.length)],
          field: rng() < 0.8 ? fieldsDef[Math.floor(rng() * fieldsDef.length)][0] : '',
        });
      }
      return msgs;
    }

    function buildChannelUncompared(channelName, rng, fieldsDef) {
      const list = [];
      const n = Math.floor(rng() * 2);
      for (let i = 0; i < n; i++) {
        const d = fieldsDef[Math.floor(rng() * fieldsDef.length)];
        list.push({ channel: channelName, xpath: d[1], note: '未在映射配置中匹配到对应 CSV 字段' });
      }
      return list;
    }

    function buildChannelLogs(ch, tradeId) {
      const t = '2024-08-14 10:23:0';
      return [
        t + '0.200 INFO  [' + ch.name + '] 读取报送文件 ' + ch.files.ao.join(', '),
        t + '0.300 INFO  [' + ch.name + '] 应用映射配置 ' + ch.files.excel.file + ' [sheet: ' + ch.files.excel.sheet + ']',
        t + '0.400 INFO  [' + ch.name + '] 完成字段比较，渠道结果已生成',
      ];
    }

    function buildPrints(f, x, ctx, chName, srcName, eo, ao, result, note) {
      return [
        '[INFO] 比较字段 ' + f + '（报告渠道 ' + chName + ' / ' + srcName + '）',
        '[INFO] XPath=' + x + '，命中Ctx键=' + ctx,
        '[INFO] EO=' + eo + '，AO=' + ao + ' → ' + result + (note ? '（' + note + '）' : ''),
      ];
    }

    function buildChannelData(ch, tradeId, reportDate, rng) {
      const fieldsDef = FIELD_DEFS[ch.name];
      const ctxPool = [ch.name.toLowerCase() + '.ctx.default', ch.name.toLowerCase() + '.ctx.v2', ch.name.toLowerCase() + '.ctx.v3'];
      const sources = [1, 2].map(sn => {
        const fields = fieldsDef.map(([f, x, t, k], idx) => {
          const eo = genValue(k, rng);
          const failed = rng() < 0.18;
          const ao = failed ? mutateValue(eo, k, rng) : eo;
          const ctx = ctxPool[Math.floor(rng() * ctxPool.length)];
          const result = failed ? 'FAILED' : 'PASSED';
          const note = failed ? noteFor(k) : '';
          return {
            id: ch.name + '-' + sn + '-' + idx,
            f: f, x: x, t: t, k: k, ctx: ctx,
            eo: eo, ao: ao,
            result: result, note: note,
            prints: buildPrints(f, x, ctx, ch.name, '来源渠道 ' + (sn === 1 ? 'A' : 'B'), eo, ao, result, note),
          };
        });
        return { name: '来源渠道 ' + (sn === 1 ? 'A' : 'B'), fields: fields };
      });

      const files = {
        eo: [ch.name.toLowerCase() + '_srcA_' + reportDate + '.csv', ch.name.toLowerCase() + '_srcB_' + reportDate + '.csv'],
        ao: [ch.name.toUpperCase() + '_001.xml', ch.name.toUpperCase() + '_002.xml'],
        excel: { file: 'mapping.xlsx', sheet: ch.name },
      };

      return {
        name: ch.name, desc: ch.desc, files: files, sources: sources,
        warnings: buildMessages('warning', rng, ch.name, fieldsDef),
        errors: buildMessages('error', rng, ch.name, fieldsDef),
        uncompared: buildChannelUncompared(ch.name, rng, fieldsDef),
        logs: buildChannelLogs({ name: ch.name, files: files }, tradeId),
      };
    }

    function buildDataset() {
      const rng = mulberry32(20240814);
      const items = [];
      for (let i = 0; i < 3; i++) {
        const tradeId = 'T-20240814-' + String(i + 1).padStart(4, '0');
        const reportDate = '2024-08-' + String(12 + i).padStart(2, '0');
        const generatedAt = '2024-08-14 10:23:0' + i + '.000';
        const channels = CHANNELS.map(ch => buildChannelData(ch, tradeId, reportDate, rng));
        items.push({
          tradeId: tradeId,
          reportDate: reportDate,
          generatedAt: generatedAt,
          channels: channels,
          overviewLogs: [
            '2024-08-14 10:23:00.123 INFO  开始比较 item=' + tradeId + '，报告日期=' + reportDate,
            '2024-08-14 10:23:00.140 INFO  加载映射配置 mapping.xlsx（' + channels.length + ' 个报告渠道）',
            '2024-08-14 10:23:00.160 INFO  逐渠道执行比较（HKTR / JSFA / CFTC）',
          ],
        });
      }
      return items;
    }

    /* ---------- 应用状态与渲染 ---------- */
    const DATA = { items: buildDataset() };
    const state = {
      itemId: DATA.items[0].tradeId,
      tab: 'fields',
      channel: 'ALL',
      search: '',
      colFilter: { f: '', x: '', t: 'ALL', result: 'ALL' },
      sort: { key: '', dir: 1 },
      page: 1,
      pageSize: 20,
    };
    let ACTIVE_FILTERS = [];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function currentItem() {
      return DATA.items.find(it => it.tradeId === state.itemId) || DATA.items[0];
    }

    function scopeChannels() {
      const it = currentItem();
      if (state.channel === 'ALL') return it.channels;
      return it.channels.filter(c => c.name === state.channel);
    }

    function flatFields(item) {
      const rows = [];
      item.channels.forEach(ch => {
        ch.sources.forEach(s => {
          s.fields.forEach(f => rows.push({
            channel: ch.name, source: s.name,
            id: f.id, f: f.f, x: f.x, t: f.t, ctx: f.ctx,
            eo: f.eo, ao: f.ao, result: f.result, note: f.note, prints: f.prints,
          }));
        });
      });
      return rows;
    }

    function itemStatsAll(item) {
      let total = 0, passed = 0, failed = 0;
      item.channels.forEach(ch => ch.sources.forEach(s => s.fields.forEach(f => {
        total++;
        f.result === 'PASSED' ? passed++ : failed++;
      })));
      const warnings = item.channels.reduce((n, c) => n + c.warnings.length, 0);
      const errors = item.channels.reduce((n, c) => n + c.errors.length, 0);
      const uncompared = item.channels.reduce((n, c) => n + c.uncompared.length, 0);
      const logs = item.overviewLogs.length + item.channels.reduce((n, c) => n + c.logs.length, 0);
      return { total: total, passed: passed, failed: failed, rate: total ? Math.round(passed / total * 100) : 0, warnings: warnings, errors: errors, uncompared: uncompared, logs: logs };
    }

    function scopeWarnings() { const a = []; scopeChannels().forEach(c => c.warnings.forEach(w => a.push(w))); return a; }
    function scopeErrors() { const a = []; scopeChannels().forEach(c => c.errors.forEach(w => a.push(w))); return a; }
    function scopeUncompared() { const a = []; scopeChannels().forEach(c => c.uncompared.forEach(w => a.push(w))); return a; }
    function scopeLogs() {
      const it = currentItem();
      if (state.channel === 'ALL') {
        const lines = it.overviewLogs.slice();
        it.channels.forEach(c => c.logs.forEach(l => lines.push(l)));
        return lines;
      }
      const c = it.channels.find(c => c.name === state.channel);
      return c ? c.logs.slice() : [];
    }

    function scopeStats() {
      let total = 0, passed = 0, failed = 0;
      scopeChannels().forEach(ch => ch.sources.forEach(s => s.fields.forEach(f => {
        total++;
        f.result === 'PASSED' ? passed++ : failed++;
      })));
      return {
        total: total, passed: passed, failed: failed,
        rate: total ? Math.round(passed / total * 100) : 0,
        warnings: scopeWarnings().length,
        errors: scopeErrors().length,
        uncompared: scopeUncompared().length,
        logs: scopeLogs().length,
      };
    }

    function sortValue(r, key) {
      switch (key) {
        case 'f': return r.f;
        case 'x': return r.x;
        case 't': return r.t;
        case 'result': return r.result;
        case 'ctx': return r.ctx;
        case 'eo': return r.eo;
        case 'ao': return r.ao;
        case 'channel': return r.channel;
        case 'source': return r.source;
        default: return '';
      }
    }

    function filteredFields(item) {
      let rows = flatFields(item);
      if (state.channel !== 'ALL') rows = rows.filter(r => r.channel === state.channel);
      const cf = state.colFilter;
      if (cf.f) rows = rows.filter(r => r.f.toLowerCase().includes(cf.f.toLowerCase()));
      if (cf.x) rows = rows.filter(r => r.x.toLowerCase().includes(cf.x.toLowerCase()));
      if (cf.t !== 'ALL') rows = rows.filter(r => r.t === cf.t);
      if (cf.result !== 'ALL') rows = rows.filter(r => r.result === cf.result);
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        rows = rows.filter(r => (r.f + ' ' + r.x + ' ' + r.eo + ' ' + r.ao + ' ' + r.ctx).toLowerCase().includes(q));
      }
      if (state.sort.key) {
        const k = state.sort.key, d = state.sort.dir;
        rows.sort((a, b) => { const va = sortValue(a, k), vb = sortValue(b, k); if (va < vb) return -1 * d; if (va > vb) return 1 * d; return 0; });
      }
      return rows;
    }

    function preview(v) {
      const s = String(v).replace(/\r?\n/g, ' ⏎ ');
      return s.length > 32 ? s.slice(0, 32) + '…' : s;
    }

    function typeChip(t) {
      const m = TYPE_META[t] || { label: t, cls: '' };
      return '<span class="chip ' + m.cls + '">' + esc(m.label) + '</span>';
    }

    function sortArrow(key) {
      if (state.sort.key !== key) return '⇅';
      return state.sort.dir === 1 ? '▲' : '▼';
    }

    function findFieldById(item, id) {
      for (const ch of item.channels) {
        for (const s of ch.sources) {
          for (const f of s.fields) if (f.id === id) return { channel: ch.name, source: s.name, field: f };
        }
      }
      return null;
    }

    /* ---- 渲染 ---- */
    function renderSidebar() {
      const rows = DATA.items.map(it => {
        const s = itemStatsAll(it);
        const cls = it.tradeId === state.itemId ? 'item active' : 'item';
        return '<div class="' + cls + '" data-id="' + it.tradeId + '">' +
          '<div class="item-id">' + esc(it.tradeId) + '</div>' +
          '<div class="item-sub">' + s.total + ' 字段 · ' + s.failed + ' 失败 · ' + s.rate + '% 通过</div>' +
          '<div class="item-sub">报告日期 ' + esc(it.reportDate) + '</div>' +
          '<div class="bar"><div class="bar-fill" style="width:' + s.rate + '%"></div></div>' +
          '</div>';
      }).join('');
      document.getElementById('sidebar').innerHTML =
        '<div class="sidebar-head">比较 item 列表<span class="count">' + DATA.items.length + '</span></div>' + rows;
    }

    function renderSummary() {
      const s = scopeStats();
      const cards = [
        { label: '字段总数', value: s.total, cls: '', action: 'fields', active: state.tab === 'fields' && state.colFilter.result === 'ALL' },
        { label: '通过 (PASSED)', value: s.passed, cls: 'ok', action: 'passed', active: state.tab === 'fields' && state.colFilter.result === 'PASSED' },
        { label: '失败 (FAILED)', value: s.failed, cls: 'bad', action: 'failed', active: state.tab === 'fields' && state.colFilter.result === 'FAILED' },
        { label: '通过率', value: s.rate + '%', cls: '', action: null, active: false },
        { label: '警告', value: s.warnings, cls: 'warn', action: 'warnings', active: state.tab === 'warnings' },
        { label: '错误', value: s.errors, cls: 'bad', action: 'errors', active: state.tab === 'errors' },
      ];
      document.getElementById('summary').innerHTML = cards.map(c => {
        const cls = 'card' + (c.action ? ' clickable' : '') + (c.active ? ' active-filter' : '');
        const attr = c.action ? ' data-action="' + c.action + '"' : '';
        return '<div class="' + cls + '"' + attr + '>' +
          '<div class="card-label">' + c.label + '</div>' +
          '<div class="card-value ' + c.cls + '">' + c.value + '</div></div>';
      }).join('');
    }

    function renderMeta() {
      const it = currentItem();
      document.getElementById('itemMeta').textContent = it.tradeId;
      document.getElementById('reportMeta').textContent = '报告日期：' + it.reportDate + '　　生成时间：' + it.generatedAt;
      document.getElementById('channelMeta').textContent = '报告渠道：' +
        it.channels.map(c => c.name + '（' + c.desc + '）').join('　');
    }

    function renderFiles() {
      const it = currentItem();
      const chs = state.channel === 'ALL' ? it.channels : it.channels.filter(c => c.name === state.channel);
      const html = chs.map(ch =>
        '<div class="file-card">' +
        '<div class="fc-head">' + esc(ch.name) + '</div>' +
        '<div class="fc-row"><span class="fc-label">EO (CSV): </span>' + ch.files.eo.map(esc).join('、') + '</div>' +
        '<div class="fc-row"><span class="fc-label">AO (XML): </span>' + ch.files.ao.map(esc).join('、') + '</div>' +
        '<div class="fc-row"><span class="fc-label">Excel: </span>' + esc(ch.files.excel.file) + ' [sheet: ' + esc(ch.files.excel.sheet) + ']</div>' +
        '</div>'
      ).join('');
      document.getElementById('filesPanel').innerHTML =
        '<div class="files-title">输入 / 配置文件（EO=来源 CSV，AO=报送 XML，Excel=映射配置）</div>' +
        '<div class="files-grid">' + html + '</div>';
    }

    function renderTabs() {
      const s = scopeStats();
      const tabs = [
        ['fields', '字段比较', s.total],
        ['warnings', '警告', s.warnings],
        ['errors', '错误', s.errors],
        ['uncompared', '未比较 XPath', s.uncompared],
        ['logs', '完整日志', s.logs],
      ];
      document.getElementById('tabs').innerHTML = tabs.map(([k, label, n]) => {
        const cls = state.tab === k ? 'tab active' : 'tab';
        return '<button class="' + cls + '" data-tab="' + k + '">' + label +
          '<span class="tab-count">' + n + '</span></button>';
      }).join('');
    }

    function channelCount(chName, tab) {
      const it = currentItem();
      if (chName === 'ALL') {
        if (tab === 'fields') return flatFields(it).length;
        if (tab === 'warnings') return it.channels.reduce((n, c) => n + c.warnings.length, 0);
        if (tab === 'errors') return it.channels.reduce((n, c) => n + c.errors.length, 0);
        if (tab === 'uncompared') return it.channels.reduce((n, c) => n + c.uncompared.length, 0);
        if (tab === 'logs') return it.overviewLogs.length + it.channels.reduce((n, c) => n + c.logs.length, 0);
      }
      const ch = it.channels.find(c => c.name === chName);
      if (!ch) return 0;
      if (tab === 'fields') return flatFields(it).filter(r => r.channel === chName).length;
      if (tab === 'warnings') return ch.warnings.length;
      if (tab === 'errors') return ch.errors.length;
      if (tab === 'uncompared') return ch.uncompared.length;
      if (tab === 'logs') return ch.logs.length;
      return 0;
    }

    function renderChannelTabs() {
      const it = currentItem();
      const chs = [['ALL', '全部']].concat(it.channels.map(ch => [ch.name, ch.name]));
      const html = chs.map(([k, label]) => {
        const cls = state.channel === k ? 'ctab active' : 'ctab';
        return '<button class="' + cls + '" data-channel="' + k + '">' + esc(label) +
          '<span class="ctab-count">' + channelCount(k, state.tab) + '</span></button>';
      }).join('');
      document.getElementById('channelTabs').innerHTML = html;
    }

    function activeFilters() {
      const list = [];
      if (state.channel !== 'ALL') list.push({ label: '渠道: ' + state.channel, clear: function () { state.channel = 'ALL'; } });
      if (state.search.trim()) list.push({ label: '搜索: ' + state.search.trim(), clear: function () { state.search = ''; document.getElementById('search').value = ''; } });
      if (state.tab === 'fields' || state.tab === 'warnings' || state.tab === 'errors') {
        if (state.tab === 'fields') {
          if (state.colFilter.f) list.push({ label: '字段: ' + state.colFilter.f, clear: function () { state.colFilter.f = ''; } });
          if (state.colFilter.x) list.push({ label: 'XPath: ' + state.colFilter.x, clear: function () { state.colFilter.x = ''; } });
          if (state.colFilter.result !== 'ALL') list.push({ label: '结果: ' + state.colFilter.result, clear: function () { state.colFilter.result = 'ALL'; } });
        }
        if (state.colFilter.t !== 'ALL') list.push({ label: '类型: ' + state.colFilter.t, clear: function () { state.colFilter.t = 'ALL'; } });
      }
      return list;
    }

    function renderFilterChips() {
      ACTIVE_FILTERS = activeFilters();
      const html = ACTIVE_FILTERS.map((f, i) =>
        '<span class="filter-chip">' + esc(f.label) +
        '<button data-clear="' + i + '" title="清除此过滤">✕</button></span>'
      ).join('');
      document.getElementById('filterChips').innerHTML = html;
    }

    function renderPagination(total, pages) {
      if (total === 0) return '';
      const p = state.page;
      const from = Math.max(1, p - 2), to = Math.min(pages, p + 2);
      let parts = ['<button class="pg" data-page="' + (p - 1) + '"' + (p === 1 ? ' disabled' : '') + '>‹</button>'];
      for (let i = from; i <= to; i++) {
        parts.push('<button class="pg' + (i === p ? ' cur' : '') + '" data-page="' + i + '">' + i + '</button>');
      }
      parts.push('<button class="pg" data-page="' + (p + 1) + '"' + (p === pages ? ' disabled' : '') + '>›</button>');
      return '<div class="pagination">' + parts.join('') +
        '<span class="pg-info">第 ' + p + ' / ' + pages + ' 页</span>' +
        '<select id="pageSize">' +
        [10, 20, 50].map(n => '<option' + (state.pageSize === n ? ' selected' : '') + '>' + n + '</option>').join('') +
        '</select></div>';
    }

    function headerFilterHtml(key, placeholder) {
      const v = state.colFilter[key] || '';
      return '<input class="hfilter" data-col="' + key + '" placeholder="' + placeholder + '" value="' + esc(v) + '">';
    }
    function headerSelectHtml(key, options) {
      const cur = state.colFilter[key] || 'ALL';
      const opts = options.map(o => '<option value="' + o + '"' + (cur === o ? ' selected' : '') + '>' + o + '</option>').join('');
      return '<select class="hfilter" data-col="' + key + '">' + opts + '</select>';
    }

    function renderFields() {
      const rows = filteredFields(currentItem());
      const total = rows.length;
      const pages = Math.max(1, Math.ceil(total / state.pageSize));
      if (state.page > pages) state.page = pages;
      const start = (state.page - 1) * state.pageSize;
      const pageRows = rows.slice(start, start + state.pageSize);

      const trs = pageRows.map(r => {
        const pass = r.result === 'PASSED';
        return '<tr class="' + (pass ? '' : 'row-fail') + '" data-result="' + r.result + '" data-type="' + r.t + '">' +
          '<td><span class="chip channel-chip">' + esc(r.channel) + '</span></td>' +
          '<td>' + esc(r.source) + '</td>' +
          '<td class="mono"><a class="val-link" data-detail="' + esc(r.id) + '" title="查看比较详情">' + esc(r.f) + '</a></td>' +
          '<td class="mono xpath" title="' + esc(r.x) + '">' + esc(r.x) + '</td>' +
          '<td>' + typeChip(r.t) + '</td>' +
          '<td class="mono">' + esc(r.ctx) + '</td>' +
          '<td><span class="val" title="' + esc(r.eo) + '">' + esc(preview(r.eo)) + '</span></td>' +
          '<td><span class="val" title="' + esc(r.ao) + '">' + esc(preview(r.ao)) + '</span></td>' +
          '<td><span class="badge ' + (pass ? 'pass' : 'fail') + '">' + r.result + '</span></td>' +
          '<td class="note">' + esc(r.note || '—') + '</td>' +
          '</tr>';
      }).join('');

      const th = function (label, key, filterHtml, sortable) {
        const cls = sortable ? 'sortable' : '';
        return '<th class="' + cls + '" data-sort="' + key + '">' + label +
          (sortable ? ' <span class="sort-arrow">' + sortArrow(key) + '</span>' : '') +
          (filterHtml ? filterHtml : '') + '</th>';
      };

      document.getElementById('content').innerHTML =
        '<div class="table-wrap"><table>' +
        '<thead><tr>' +
        th('报告渠道', 'channel', null, false) +
        th('来源渠道', 'source', null, false) +
        th('字段', 'f', headerFilterHtml('f', '过滤字段'), true) +
        th('XPath', 'x', headerFilterHtml('x', '过滤 XPath'), true) +
        th('类型', 't', headerSelectHtml('t', ['ALL', 'platformAssertion', 'productAssertion', 'contextAssertion']), true) +
        th('命中Ctx键', 'ctx', null, false) +
        th('期望值 (EO)', 'eo', null, false) +
        th('实际值 (AO)', 'ao', null, false) +
        th('结果', 'result', headerSelectHtml('result', ['ALL', 'PASSED', 'FAILED']), true) +
        th('说明', 'note', null, false) +
        '</tr></thead>' +
        '<tbody>' + (trs || '<tr><td colspan="10" class="empty">无匹配记录</td></tr>') + '</tbody>' +
        '</table></div>' +
        renderPagination(total, pages) +
        '<div class="meta-note">共 ' + total + ' 条字段比较记录（已应用当前过滤条件）</div>';
    }

    function renderMessages(level) {
      let list = level === 'warning' ? scopeWarnings() : scopeErrors();
      if (state.colFilter.t !== 'ALL') list = list.filter(m => m.type === state.colFilter.t);
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter(m => (m.text + ' ' + m.field + ' ' + m.channel).toLowerCase().includes(q));
      }
      const isWarn = level === 'warning';
      const rows = list.map(m =>
        '<tr>' +
        '<td><span class="chip channel-chip">' + esc(m.channel) + '</span></td>' +
        '<td>' + typeChip(m.type) + '</td>' +
        '<td><span class="badge ' + (isWarn ? 'warn' : 'fail') + '">' + (isWarn ? 'WARN' : 'ERROR') + '</span></td>' +
        '<td>' + esc(m.text) + '</td>' +
        '<td class="mono">' + esc(m.field || '—') + '</td>' +
        '</tr>'
      ).join('');
      document.getElementById('content').innerHTML =
        '<div class="table-wrap"><table>' +
        '<thead><tr>' +
        '<th>报告渠道</th>' +
        '<th>类型' + headerSelectHtml('t', ['ALL', 'platformAssertion', 'productAssertion', 'contextAssertion']) + '</th>' +
        '<th>级别</th><th>信息</th><th>关联字段</th>' +
        '</tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="5" class="empty">无记录</td></tr>') + '</tbody>' +
        '</table></div>' +
        '<div class="meta-note">共 ' + list.length + ' 条' + (isWarn ? '警告' : '错误') + '信息（' + (state.channel === 'ALL' ? 'item 级' : state.channel + ' 渠道') + '）</div>';
    }

    function renderUncompared() {
      let list = scopeUncompared();
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter(u => (u.xpath + ' ' + u.channel).toLowerCase().includes(q));
      }
      const rows = list.map(u =>
        '<tr>' +
        '<td><span class="chip channel-chip">' + esc(u.channel) + '</span></td>' +
        '<td class="mono">' + esc(u.xpath) + '</td>' +
        '<td class="note">' + esc(u.note) + '</td>' +
        '</tr>'
      ).join('');
      document.getElementById('content').innerHTML =
        '<div class="table-wrap"><table>' +
        '<thead><tr><th>报告渠道</th><th>XPath</th><th>说明</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="3" class="empty">无未比较的 XPath</td></tr>') + '</tbody>' +
        '</table></div>' +
        '<div class="meta-note">共 ' + list.length + ' 个 XPath 未参与比较（' + (state.channel === 'ALL' ? 'item 级' : state.channel + ' 渠道') + '）</div>';
    }

    function renderLogs() {
      let lines = scopeLogs();
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        lines = lines.filter(l => l.toLowerCase().includes(q));
      }
      const html = lines.map(l => '<div class="log-line">' + esc(l) + '</div>').join('');
      document.getElementById('content').innerHTML =
        '<div class="log-box">' + (html || '<div>无日志</div>') + '</div>' +
        '<div class="meta-note">共 ' + lines.length + ' 行日志（' + (state.channel === 'ALL' ? 'item 级' : state.channel + ' 渠道') + '）</div>';
    }

    function renderContent() {
      if (state.tab === 'fields') renderFields();
      else if (state.tab === 'warnings') renderMessages('warning');
      else if (state.tab === 'errors') renderMessages('error');
      else if (state.tab === 'uncompared') renderUncompared();
      else if (state.tab === 'logs') renderLogs();
    }

    function render() {
      renderSidebar();
      renderSummary();
      renderMeta();
      renderFiles();
      renderTabs();
      renderChannelTabs();
      renderFilterChips();
      renderContent();
    }

    /* ---------- 详情弹窗 ---------- */
    function closeModal() {
      const b = document.querySelector('.modal-backdrop');
      if (b) b.remove();
    }

    function openModal(id) {
      const found = findFieldById(currentItem(), id);
      if (!found) return;
      const f = found.field;
      const pass = f.result === 'PASSED';
      const tm = TYPE_META[f.t] || { label: f.t };
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML =
        '<div class="modal">' +
        '<div class="modal-head"><h3>字段比较详情：' + esc(f.f) + '</h3>' +
        '<button class="modal-close" title="关闭">✕</button></div>' +
        '<div class="modal-body">' +
        '<div class="kv">' +
        '<span class="k">报告渠道</span><span class="v">' + esc(found.channel) + '</span>' +
        '<span class="k">来源渠道</span><span class="v">' + esc(found.source) + '</span>' +
        '<span class="k">字段</span><span class="v">' + esc(f.f) + '</span>' +
        '<span class="k">XPath</span><span class="v">' + esc(f.x) + '</span>' +
        '<span class="k">类型</span><span class="v">' + esc(tm.label) + '（' + esc(f.t) + '）</span>' +
        '<span class="k">命中Ctx键</span><span class="v">' + esc(f.ctx) + '</span>' +
        '<span class="k">结果</span><span class="v"><span class="badge ' + (pass ? 'pass' : 'fail') + '">' + f.result + '</span>' +
        (f.note ? '　' + esc(f.note) : '') + '</span>' +
        '</div>' +
        '<div class="pair">' +
        '<div class="pair-box"><div class="pb-head">期望值 (EO)</div><pre>' + esc(f.eo) + '</pre></div>' +
        '<div class="pair-box"><div class="pb-head">实际值 (AO)</div><pre>' + esc(f.ao) + '</pre></div>' +
        '</div>' +
        '<div class="print-box"><div class="pb-head">相关打印信息</div>' +
        f.prints.map(p => '<div class="print-line">' + esc(p) + '</div>').join('') +
        '</div>' +
        '</div></div>';
      backdrop.addEventListener('click', function (e) {
        if (e.target === backdrop || e.target.closest('.modal-close')) closeModal();
      });
      document.body.appendChild(backdrop);
    }

    /* ---------- 事件绑定 ---------- */
    function bindEvents() {
      document.getElementById('search').addEventListener('input', function (e) {
        state.search = e.target.value; state.page = 1;
        renderFilterChips(); renderContent();
      });

      document.getElementById('summary').addEventListener('click', function (e) {
        const card = e.target.closest('[data-action]');
        if (!card) return;
        const action = card.getAttribute('data-action');
        state.page = 1;
        if (action === 'fields') { state.tab = 'fields'; state.colFilter.result = 'ALL'; }
        else if (action === 'passed') { state.tab = 'fields'; state.colFilter.result = 'PASSED'; }
        else if (action === 'failed') { state.tab = 'fields'; state.colFilter.result = 'FAILED'; }
        else if (action === 'warnings') { state.tab = 'warnings'; }
        else if (action === 'errors') { state.tab = 'errors'; }
        render();
      });

      document.getElementById('filterChips').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-clear]');
        if (!btn) return;
        const idx = parseInt(btn.getAttribute('data-clear'), 10);
        if (ACTIVE_FILTERS[idx]) ACTIVE_FILTERS[idx].clear();
        state.page = 1;
        render();
      });

      document.getElementById('sidebar').addEventListener('click', function (e) {
        const el = e.target.closest('[data-id]');
        if (!el) return;
        state.itemId = el.getAttribute('data-id');
        state.page = 1;
        state.channel = 'ALL';
        state.colFilter = { f: '', x: '', t: 'ALL', result: 'ALL' };
        state.sort = { key: '', dir: 1 };
        state.search = '';
        document.getElementById('search').value = '';
        render();
      });

      document.getElementById('tabs').addEventListener('click', function (e) {
        const el = e.target.closest('[data-tab]');
        if (!el) return;
        state.tab = el.getAttribute('data-tab'); state.page = 1;
        renderTabs(); renderChannelTabs(); renderFilterChips(); renderContent();
      });

      document.getElementById('channelTabs').addEventListener('click', function (e) {
        const el = e.target.closest('[data-channel]');
        if (!el) return;
        state.channel = el.getAttribute('data-channel'); state.page = 1;
        render();
      });

      document.getElementById('content').addEventListener('click', function (e) {
        const pg = e.target.closest('[data-page]');
        if (pg && !pg.disabled) {
          state.page = parseInt(pg.getAttribute('data-page'), 10);
          renderContent();
          return;
        }
        const detail = e.target.closest('[data-detail]');
        if (detail) { openModal(detail.getAttribute('data-detail')); return; }
        const th = e.target.closest('th.sortable');
        if (th && !e.target.closest('.hfilter')) {
          const key = th.getAttribute('data-sort');
          if (state.sort.key === key) state.sort.dir = state.sort.dir === 1 ? -1 : 1;
          else { state.sort.key = key; state.sort.dir = 1; }
          state.page = 1;
          renderContent();
        }
      });

      document.getElementById('content').addEventListener('input', function (e) {
        if (e.target && e.target.matches('.hfilter[data-col]')) {
          state.colFilter[e.target.getAttribute('data-col')] = e.target.value;
          state.page = 1;
          const col = e.target.getAttribute('data-col');
          renderContent();
          renderFilterChips();
          const el = document.querySelector('.hfilter[data-col="' + col + '"]');
          if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; }
        }
      });

      document.getElementById('content').addEventListener('change', function (e) {
        if (e.target && e.target.id === 'pageSize') {
          state.pageSize = parseInt(e.target.value, 10);
          state.page = 1;
          renderContent();
        } else if (e.target && e.target.matches('select.hfilter[data-col]')) {
          state.colFilter[e.target.getAttribute('data-col')] = e.target.value;
          state.page = 1;
          renderContent();
          renderFilterChips();
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
      });
    }

    bindEvents();
    render();
  </script>
</body>
</html>
